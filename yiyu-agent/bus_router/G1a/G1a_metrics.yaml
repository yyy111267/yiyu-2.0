# ============================================================
# 商业模式文件：G1a 品牌消费
# 作用：告诉llm「这类公司该算哪些指标、怎么解读、什么是红旗、怎么估值」
# 读者：机器读 metrics/red_flags/valuation（算数）；大模型读 SKILL.md（解读）
# 读者	机器（确定性代码）该文档负责算什么、怎么算、阈值多少，由机器执行，不能算错
# ============================================================

group: G1a
name: 品牌消费
extends: core                      # 先继承通用底座，再叠加本组特有指标

# ── 这个组是什么 ──────────────────────────────────
identity:
  one_liner: 靠品牌收溢价、轻资产、经销商预付款的消费公司
  value_source: 品牌定价权 + 渠道控制力
  kill_variables:                  # 生死变量：分析时优先看这几个
    - 提价能力（还有没有定价权）
    - 渠道健康度（有没有压货）
  representative_industries:
    - 白酒：贵州茅台、五粮液、泸州老窖、山西汾酒、洋河股份
    - 食品饮料：农夫山泉、东鹏饮料、青岛啤酒、华润啤酒、双汇发展、洽洽食品、三只松鼠
    - 家电：美的集团、格力电器、海尔智家、海信视像、TCL科技
    - 调味品/乳制品：海天味业、中炬高新（厨邦）、千禾味业、恒顺醋业、伊利股份、蒙牛乳业、光明乳业
    - 化妆品/品牌服饰：珀莱雅、上海家化、贝泰妮（薇诺娜）、巨子生物、安踏体育、李宁、海澜之家、比音勒芬
    - 连锁餐饮/消费零售：海底捞、百胜中国、蜜雪冰城、奈雪的茶、泡泡玛特、名创优品

# ── 该算哪些指标 ─────────────────────────────────
# 每个指标声明：怎么算、依赖哪些字段、什么单位、方向、解读分档、何时不适用
metrics:

  - id: contract_liability_yoy
    name: 合同负债同比
    formula: yoy_growth            # 指向公式注册表里的函数，不在这里写公式字符串
    inputs:
      current: contract_liability@latest      # @latest / @yoy 是取期声明，引擎负责对齐期间
      prior:   contract_liability@yoy
    unit: pct
    direction: higher_better
    bands:                         # 数值→档位标签，大模型拿到的是"档位+数值"而非裸数字
      - {max: -10,          label: 恶化, severity: high}
      - {min: -10, max: 0,  label: 走弱, severity: mid}
      - {min: 0,   max: 20, label: 平稳}
      - {min: 20,           label: 强劲}
    why: 经销商打款意愿，领先营收 1-2 个季度，白酒最强领先指标
    na_when: [contract_liability_missing]

  - id: price_volume_split
    name: 量价拆分
    formula: price_volume_decomposition
    inputs: [revenue@series, sales_volume@series]
    unit: pct
    why: 提价驱动的增长质量 > 放量驱动 > 靠铺货
    note: 拆出"提价贡献"和"销量贡献"两个分量

  - id: cash_conversion_cycle
    name: 现金转换周期
    formula: ccc
    inputs: [inventory, accounts_receivable, accounts_payable, revenue, cogs]
    unit: days
    direction: lower_better
    bands:
      - {max: 0,   label: 优秀（占用上下游资金）}
      - {min: 0,   max: 60, label: 正常}
      - {min: 60,  label: 偏弱}
    why: 品牌消费应为负值，说明对上下游有话语权

  - id: sales_expense_efficiency
    name: 费效比
    formula: incremental_revenue_per_expense
    inputs: [revenue, selling_expense]
    direction: higher_better
    why: 每投入 1 元销售费用换来多少增量收入，衡量品牌自然拉力

  - id: roic_ex_cash
    name: ROIC（剔除超额现金）
    formula: roic_ex_excess_cash
    inputs: [ebit, total_assets, cash, current_liabilities]
    unit: pct
    direction: higher_better
    bands:
      - {max: 15,  label: 偏低, severity: mid}
      - {min: 15,  max: 25, label: 良好}
      - {min: 25,  label: 优秀}
    na_when: [invested_capital_non_positive]

# ── 红旗：组合条件，多个指标同时命中才触发（不是单指标预警）──
red_flags:
  - id: channel_stuffing
    name: 渠道压货
    condition:                     # 全部命中才算，避免误报
      - contract_liability_yoy < 0
      - accounts_receivable_yoy > revenue_yoy
      - inventory_days_yoy > 0
      - revenue_yoy > 0            # 营收还在涨 → 制造"增长假象"
    severity: high
    meaning: 营收增长是把货压给经销商制造的，非真实终端需求

  - id: pricing_power_erosion
    name: 定价权衰减
    condition:
      - gross_margin_yoy < 0
      - price_contribution < 0     # 量价拆分里提价贡献转负
    severity: mid
    meaning: 提不动价，护城河在变浅

# ── 相对通用底座要覆盖/改写的规则 ──────────────────
overrides:
  capex_intensity:
    direction: lower_better        # 品牌消费 capex 越低越好（与 G1b 相反）
    note: capex 骤升可能意味着护城河在恶化、被迫重资产化

# ── 估值方法 ─────────────────────────────────────
valuation:
  primary: dcf_with_roic           # 主模型：DCF + ROIC/g 框架
  cross_check: [pe_normalized, dividend_yield_percentile]
  scenario_model: pe_scenario      # 四档情景用固定 kernel（Tier B）

# ── 数据依赖（供取数层预取，一次拉齐避免多次请求）──────
required_raw_fields:
  - contract_liability
  - revenue
  - sales_volume
  - inventory
  - accounts_receivable
  - accounts_payable
  - cogs
  - selling_expense
  - ebit
  - total_assets
  - cash
  - current_liabilities
  - gross_margin

# ── 指向给大模型读的解读手册 ─────────────────────────
framework_doc: ./SKILL.md
