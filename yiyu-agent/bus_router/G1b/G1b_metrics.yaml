# ============================================================
# 商业模式文件：G1b 受监管公用
# 特点：本组是"继承底座 + 大量override"的典型
#   —— 它和 G1a 都继承 core，但很多规则要反着改：
#      · capex 越多越好（在扩RAB），与G1a相反
#      · FCF为负是健康的（扩张期），要禁用底座的FCF门槛
#      · ROE不是越高越好，而是接近准许ROE（太高会被降价）
# 这份文件示范：如何用 override / disable 把通用底座"改造"成本组逻辑
# ============================================================

group: G1b
name: 受监管公用
extends: core

identity:
  one_liner: 政府定价、准许收益封顶、现金流高度可预测的类债资产
  value_source: 监管准许收益率 + 资产规模(RAB)扩张
  kill_variables:
    - 监管定价政策（准许收益率会不会变）
    - 融资成本（能否低于准许收益率）
  representative_industries:
    - 电力（水电/火电/核电/新能源运营）：长江电力、华能水电、国投电力、华能国际、大唐发电、国电电力、中国广核、中国核电、三峡能源、龙源电力
    - 水务：洪城环境、兴蓉环境、创业环保、中原环保、重庆水务
    - 燃气：华润燃气、港华智慧能源、新奥股份、深圳燃气、佛燃能源
    - 高速公路：宁沪高速、粤高速A、山东高速、皖通高速、深高速、现代投资
    - 铁路：京沪高铁、大秦铁路、广深铁路
    - 港口：上港集团、宁波港、唐山港、北部湾港、青岛港、盐田港
  special_note: 本质是长期债券，对利率敏感；用DDM/股息框架估值，不是DCF

metrics:

  - id: rab_growth
    name: 受监管资产基数(RAB)增速
    formula: yoy_growth
    inputs:
      current: regulated_asset_base@latest
      prior:   regulated_asset_base@yoy
    unit: pct
    direction: higher_better
    why: RAB是准许利润的计算基数，RAB扩张=未来利润增长的来源
    na_when: [rab_not_disclosed]     # 多数A股用净资产/固定资产近似

  - id: allowed_vs_actual_roe
    name: 准许ROE与实际ROE之差
    formula: spread
    inputs: [allowed_roe, actual_roe]
    unit: pct
    direction: near_zero             # ★不是越大越好，是越接近0越好
    why: 实际远高于准许→未来会被降价；远低于→运营效率有问题

  - id: utilization
    name: 产能利用率
    formula: utilization_rate
    inputs: [actual_output, capacity]
    unit: pct
    direction: higher_better
    why: 发电利用小时数/车流量/供水量——量的维度
    note: 不同子行业口径不同（发电用小时数，高速用车流量）

  - id: capex_to_depreciation
    name: capex/折旧
    formula: ratio
    inputs: [capital_expenditure, depreciation]
    unit: x
    direction: higher_better         # ★>1是好事，与G1a完全相反
    bands:
      - {max: 1,   label: 资产收缩, severity: mid}
      - {min: 1,   max: 2, label: 稳定扩张}
      - {min: 2,   label: 高速扩张}
    why: ">1说明在扩RAB，是增长来源；<1说明资产在萎缩"

  - id: dividend_coverage
    name: 股息覆盖率
    formula: dividend_coverage
    inputs: [operating_cash_flow, interest_expense, maintenance_capex, total_dividends_paid]
    unit: x
    direction: higher_better
    bands:
      - {max: 1,   label: 派息不可持续, severity: high}
      - {min: 1,   max: 1.5, label: 偏紧, severity: mid}
      - {min: 1.5, label: 稳健}
    why: 经营现金流覆盖(利息+维持capex+股息)的能力

  - id: dividend_yield_spread
    name: 股息率与10Y国债利差
    formula: spread
    inputs: [dividend_yield, treasury_10y]
    unit: pct
    direction: higher_better
    why: 类债资产的核心估值锚——利差越厚越有吸引力

  - id: weighted_funding_cost
    name: 加权融资成本
    formula: weighted_funding_cost
    inputs: [interest_expense, total_debt]
    unit: pct
    direction: lower_better
    why: 融资成本必须低于准许收益率，否则加杠杆反而毁灭价值

# ── 红旗 ─────────────────────────────────────────
red_flags:
  - id: cost_above_allowed_return
    name: 融资成本逼近准许收益
    condition:
      - weighted_funding_cost > allowed_roe * 0.8
    severity: high
    meaning: 加杠杆的利差空间被压缩，扩张不再创造价值

  - id: payout_unsustainable
    name: 派息不可持续
    condition:
      - dividend_coverage < 1
    severity: high
    meaning: 靠借钱或卖资产在维持分红

# ── 覆盖/禁用通用底座的规则（本组精髓）─────────────
overrides:
  capex_intensity:
    direction: higher_better         # 公用事业capex越多越好
    note: 与G1a方向相反，扩张期capex是增长信号

  fcf_to_net_income:
    disabled: true                   # ★禁用！扩张期FCF长期为负是健康的
    reason: 大规模RAB投资导致FCF为负，用底座的FCF门槛会误杀整个电网/水电扩张期资产

  roic:
    interpretation: converge_to_allowed   # 不是越高越好，是接近准许收益
    note: 高ROIC不可持续，监管会通过降价把超额收益收走

  net_debt_to_ebitda:
    bands:                           # 放宽杠杆容忍度
      - {max: 3,   label: 稳健}      # 公用事业现金流稳定，高杠杆低风险
      - {min: 3,   max: 5, label: 正常}
      - {min: 5,   max: 6, label: 偏高, severity: mid}
      - {min: 6,   label: 高风险, severity: high}
    reason: 现金流可预测性极高，可承受比一般公司更高的杠杆

# ── 估值 ─────────────────────────────────────────
valuation:
  primary: ddm                       # ★股息贴现，不是DCF
  cross_check: [ev_rab, dividend_yield_percentile]
  note: 用DDM或EV/RAB；股息率历史分位判断贵贱

required_raw_fields:
  - regulated_asset_base
  - allowed_roe
  - actual_output
  - capacity
  - capital_expenditure
  - depreciation
  - operating_cash_flow
  - interest_expense
  - maintenance_capex
  - total_dividends_paid
  - dividend_yield
  - treasury_10y
  - total_debt

framework_doc: ./SKILL.md
