# ============================================================
# G1b 受监管公用 · 预热包（base_pack.yaml）
# 作用：开跑前先算好的"地基指标"，避免 LLM 边写边算或凭记忆报数。
# 结构：core 通用（剔除禁用项）+ 本组特有（RAB/准许收益/股息/融资成本）
# ============================================================

pack_name: G1b-base-pack
group: G1b
extends: core

# ── 一、core 通用（继承底座，剔除 FCF 门槛等禁用项）────────
# 注意：fcf_to_net_income 在 G1b_metrics.yaml 里 disabled（扩张期 FCF 为负是健康的）
core_metrics:
  - roic                      # 但解读为"接近准许收益"而非越高越好
  - roic_vs_wacc
  - ocf_to_net_income
  - net_debt_to_ebitda        # 放宽后的 band（见 overrides）
  - owner_earnings

# ── 二、本组特有（受监管资产的生意本质）──────────────────
step2_business_essence:
  - rab_growth                # RAB 增速：未来利润增长的来源
  - allowed_vs_actual_roe     # 准许ROE vs 实际ROE：太高会被降价
  - utilization               # 产能利用率（发电小时/车流量/供水量）
  - capex_to_depreciation     # capex/折旧：>1 在扩RAB
  - weighted_funding_cost     # 加权融资成本：必须低于准许收益率
  - dividend_coverage         # 股息覆盖率：类债资产的核心

# ── 三、第7步·估值（类债资产用股息框架，不是 DCF）────────
step7_valuation:
  - dividend_yield_spread     # 股息率与10Y国债利差：核心估值锚

# ── 取数依赖（供引擎一次拉齐）────────────────────────────
required_raw_fields:
  - regulated_asset_base
  - allowed_roe
  - actual_output
  - capacity
  - capital_expenditure
  - depreciation
  - operating_cash_flow
  - interest_expense
  - maintenance_capex
  - total_dividends_paid
  - dividend_yield
  - treasury_10y
  - total_debt
  - cash
  - ebit
  - ebitda
  - total_equity
  - tax_rate
  - net_profit
