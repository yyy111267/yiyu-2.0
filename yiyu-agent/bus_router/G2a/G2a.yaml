# ============================================================
# 商业模式文件：G2a 银行
# 特点：本组是"整体替换"的典型 —— extends: null
#   银行的会计结构与非金融公司根本不同：
#      · 没有正常意义的 revenue（收入=净利息收入+手续费）
#      · 毛利率、FCF、capex 三个概念完全失效
#      · 杠杆是"原料"不是"风险指标"（银行天然高杠杆）
#      · 风险后置——今天的利润是明天的坏账
#   所以它不能 extends: core，必须从零定义自己的指标体系
# ============================================================

group: G2a
name: 银行
extends: null                        # ★整体替换，不继承通用底座

identity:
  one_liner: 资产负债表就是生产线，靠息差赚钱，风险后置
  value_source: 净息差 × 资产规模 − 信用成本
  kill_variables:
    - 资产质量（不良会不会爆）
    - 净息差（能不能守住）
    - 资本充足（够不够支撑扩张）
  representative_industries:
    - 国有大行：工商银行、农业银行、中国银行、建设银行、交通银行、邮储银行
    - 股份制银行：招商银行、兴业银行、浦发银行、中信银行、民生银行、光大银行、平安银行、华夏银行、浙商银行
    - 城商行：北京银行、上海银行、江苏银行、宁波银行、南京银行、杭州银行、成都银行、长沙银行、郑州银行、齐鲁银行、重庆银行、贵阳银行
    - 农商行：渝农商行、沪农商行、常熟银行、无锡银行、江阴银行、苏农银行、张家港行、紫金银行、青农商行
  disabled_concepts:                 # 这些概念对银行不适用，禁止计算和引用
    - gross_margin                   # 无毛利率
    - free_cash_flow                 # FCF无意义
    - capex_intensity                # 无capex概念
    - revenue                        # 用净利息收入+非息收入替代

metrics:

  # ── 盈利能力：息差 ─────────────────────────────
  - id: nim
    name: 净息差
    formula: nim
    inputs: [net_interest_income, average_interest_earning_assets]
    unit: pct
    direction: higher_better
    bands:
      - {max: 1.5, label: 偏低, severity: mid}
      - {min: 1.5, max: 2.2, label: 一般}
      - {min: 2.2, label: 良好}
    why: 银行最核心盈利指标——生息资产赚取的利差

  - id: earning_asset_growth
    name: 生息资产增速
    formula: yoy_growth
    inputs:
      current: interest_earning_assets@latest
      prior:   interest_earning_assets@yoy
    unit: pct
    direction: higher_better
    why: 规模扩张，量的维度（量×价=净利息收入）

  # ── 资产质量：银行的生死线 ─────────────────────
  - id: npl_ratio
    name: 不良贷款率
    formula: ratio
    inputs: [non_performing_loans, total_loans]
    unit: pct
    direction: lower_better
    bands:
      - {max: 1.2, label: 优秀}
      - {min: 1.2, max: 2, label: 正常}
      - {min: 2,   label: 承压, severity: high}

  - id: overdue90_to_npl
    name: 逾期90天以上/不良
    formula: ratio
    inputs: [overdue_90d_loans, non_performing_loans]
    unit: pct
    direction: lower_better
    bands:
      - {max: 100, label: 认定审慎}
      - {min: 100, label: 认定宽松, severity: high}   # >100%=藏不良
    why: ★造假识别核心——逾期90+远超不良说明银行在隐藏不良

  - id: attention_loan_ratio
    name: 关注类贷款占比
    formula: ratio
    inputs: [special_mention_loans, total_loans]
    unit: pct
    direction: lower_better
    why: 不良的先行指标——关注类往往是未来不良的蓄水池

  - id: provision_coverage
    name: 拨备覆盖率
    formula: ratio
    inputs: [loan_loss_provisions, non_performing_loans]
    unit: pct
    direction: higher_better
    bands:
      - {max: 150, label: 偏薄, severity: mid}       # 监管红线150%
      - {min: 150, max: 300, label: 稳健}
      - {min: 300, label: 或有反哺利润空间}          # 过高可能是隐藏利润
    why: 抵御坏账的缓冲垫；过低危险，过高可能在藏利润

  - id: credit_cost
    name: 信贷成本
    formula: ratio
    inputs: [loan_impairment_charge, average_total_loans]
    unit: pct
    direction: lower_better
    why: 当期计提拨备/贷款——真实的信用损失负担

  # ── 资本充足：扩张的天花板 ─────────────────────
  - id: cet1_ratio
    name: 核心一级资本充足率
    formula: passthrough
    inputs: [core_tier1_capital_ratio]
    unit: pct
    direction: higher_better
    bands:
      - {max: 8,   label: 承压, severity: high}      # 监管底线附近
      - {min: 8,   max: 11, label: 正常}
      - {min: 11,  label: 充裕}
    why: 硬约束——资本不足无法扩张资产，可能需要再融资摊薄

  # ── 效率与结构 ────────────────────────────────
  - id: cost_income_ratio
    name: 成本收入比
    formula: ratio
    inputs: [operating_expenses, operating_income]
    unit: pct
    direction: lower_better
    bands:
      - {max: 30,  label: 高效}
      - {min: 30,  max: 40, label: 正常}
      - {min: 40,  label: 偏高, severity: mid}

  - id: roe_dupont
    name: ROE杜邦分解
    formula: dupont_bank
    inputs: [net_income, average_total_assets, average_total_equity]
    why: ROE = ROA × 权益乘数——看回报来自盈利能力还是加杠杆

  - id: demand_deposit_ratio
    name: 活期存款占比
    formula: ratio
    inputs: [demand_deposits, total_deposits]
    unit: pct
    direction: higher_better
    why: 负债质量——活期占比高=低成本负债=息差护城河

# ── 红旗：银行特有的造假/风险信号 ──────────────────
red_flags:
  - id: hidden_npl
    name: 隐藏不良
    condition:
      - overdue90_to_npl > 100         # 逾期90+超过账面不良
      - attention_loan_ratio > 3       # 关注类偏高
    severity: high
    meaning: 银行可能在放宽不良认定，账面资产质量失真

  - id: provision_smoothing
    name: 拨备反哺利润
    condition:
      - provision_coverage_yoy < -30   # 拨备覆盖率大幅下降
      - net_income_yoy > 0             # 但利润还在增长
    severity: high
    meaning: 靠释放拨备而非真实经营在制造利润增长

  - id: capital_pressure
    name: 资本承压
    condition:
      - cet1_ratio < 8.5
      - earning_asset_growth > 15      # 还在快速扩张
    severity: high
    meaning: 资本不足以支撑扩张，未来大概率再融资摊薄股东

# ── 估值 ─────────────────────────────────────────
valuation:
  primary: pb_roe                    # ★PB-ROE回归，银行标准估值法
  cross_check: [dividend_yield, pb_percentile]
  note: PB与ROE正相关；高ROE应享高PB，偏离即机会/风险

# ── 可预测性闸门（银行专用，替换底座的通用闸门）──────
gates:
  asset_quality:
    - hidden_npl 触发           → escalate    # 先查资产质量再谈估值
    - provision_smoothing 触发  → escalate

required_raw_fields:
  - net_interest_income
  - average_interest_earning_assets
  - interest_earning_assets
  - non_performing_loans
  - total_loans
  - overdue_90d_loans
  - special_mention_loans
  - loan_loss_provisions
  - loan_impairment_charge
  - average_total_loans
  - core_tier1_capital_ratio
  - operating_expenses
  - operating_income
  - net_income
  - average_total_assets
  - average_total_equity
  - demand_deposits
  - total_deposits

framework_doc: ./SKILL.md
