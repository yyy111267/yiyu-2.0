# ============================================================
# G2a 银行 · 预热包（base_pack.yaml）
# 作用：开跑前先算好的"地基指标"。
# 注意：银行 extends: null，不继承 core——ROIC/FCF/毛利率等概念对银行失效。
#       全部用 G2a_metrics.yaml 的银行专用指标。
# ============================================================

pack_name: G2a-base-pack
group: G2a
extends: null

# ── 银行核心：息差 × 资产质量 × 资本充足 ─────────────────
core_metrics: []

step2_business_essence:
  - nim                        # 净息差：最核心盈利指标
  - earning_asset_growth       # 生息资产增速：量的维度
  - npl_ratio                  # 不良贷款率：资产质量第一信号
  - provision_coverage         # 拨备覆盖率：抵御坏账的缓冲垫
  - credit_cost                # 信贷成本：当期真实的信用损失负担
  - cet1_ratio                 # 核心一级资本充足率：扩张天花板
  - cost_income_ratio          # 成本收入比：运营效率
  - roe_dupont                 # ROE杜邦分解：回报来自盈利能力还是杠杆
  - demand_deposit_ratio       # 活期存款占比：负债质量

step7_valuation:
  - pe_historical_percentile   # PB/PE 历史分位（估值锚）

# ── 取数依赖（银行专用字段）───────────────────────────────
required_raw_fields:
  - net_interest_income
  - average_interest_earning_assets
  - interest_earning_assets
  - non_performing_loans
  - total_loans
  - loan_loss_provisions
  - loan_impairment_charge
  - average_total_loans
  - core_tier1_capital_ratio
  - operating_expenses
  - operating_income
  - net_income
  - average_total_assets
  - average_total_equity
  - demand_deposits
  - total_deposits
