# ============================================================
# 商业模式文件：G2b 保险  ——  metrics.yaml（给机器读，负责"算什么/怎么算"）
#
# 整体替换型（extends: null）：保险的会计结构与非金融公司根本不同
#   · 利润来自精算假设，不是当期经营现金
#   · 当期净利润因剩余边际摊销而严重失真，不能用PE
#   · 寿险和财险是两套逻辑，指标要分别适用
#   · "revenue/毛利率/FCF/capex"概念失效
# 这份文件只负责：声明指标、公式、依赖字段、阈值分档、红旗组合、适用范围
# 解读/推理/误判 → 见同目录 SKILL.md
# ============================================================

group: G2b
name: 保险
extends: null                          # 整体替换，不继承通用底座

identity:
  one_liner: 利润来自精算假设、价值藏在存量保单里的长久期负债经营
  value_source: 新业务价值(NBV) + 存量内含价值(EV)释放 + 投资利差
  kill_variables:
    - 精算假设是否被调节（贴现率/投资收益率/死亡率/退保率）
    - 新业务价值能否持续增长（NBV增速与质量）
    - 投资端能否兑现精算假设收益率
  representative_industries:
    - 寿险：中国平安、中国人寿、新华保险、太保寿险、泰康人寿、友邦保险
    - 财产险：中国财险、中国太保、中国太平、众安在线、阳光保险
    - 再保险：中国再保险
    - 综合保险集团：中国平安、中国太保、中国人保、中国太平、众安在线
  disabled_concepts:                   # 这些概念对保险不适用，禁止计算/引用
    - gross_margin
    - free_cash_flow
    - capex_intensity
    - revenue                          # 用保费收入/NBV等专有口径替代

# ── 子类型开关：一家公司可能同时含寿险和财险，指标按适用性激活 ──
sub_lines:
  life:   [nbv, nbv_margin, ev, ev_operating_variance, csm, csm_amortization,
           new_premium, regular_premium_ratio, investment_yield_vs_assumption,
           persistency_13m, persistency_25m]
  pnc:    [combined_ratio, loss_ratio, expense_ratio, premium_growth,
           investment_yield_vs_assumption]

metrics:

  # ── 寿险：价值创造 ──────────────────────────────
  - id: nbv
    name: 新业务价值
    formula: passthrough               # 公司直接披露，取数即可
    inputs: [new_business_value]
    unit: currency
    direction: higher_better
    applies_to: [life]
    why: 当期新卖保单未来能赚多少的现值——寿险最核心的成长指标

  - id: nbv_growth
    name: 新业务价值增速
    formula: yoy_growth
    inputs:
      current: new_business_value@latest
      prior:   new_business_value@yoy
    unit: pct
    direction: higher_better
    applies_to: [life]
    bands:
      - {max: -10,          label: 大幅下滑, severity: high}
      - {min: -10, max: 0,  label: 收缩, severity: mid}
      - {min: 0,   max: 15, label: 平稳}
      - {min: 15,           label: 强劲}

  - id: nbv_margin
    name: 新业务价值率
    formula: ratio
    inputs: [new_business_value, first_year_premium_annualized]
    unit: pct
    direction: higher_better
    applies_to: [life]
    why: 每1元新单保费含多少价值——衡量保单质量，期缴长险高、趸交短险低
    bands:
      - {max: 10,  label: 低质量(趸交冲量), severity: mid}
      - {min: 10,  max: 25, label: 一般}
      - {min: 25,  label: 高质量}

  - id: ev
    name: 内含价值
    formula: passthrough
    inputs: [embedded_value]
    unit: currency
    direction: higher_better
    applies_to: [life]
    why: 调整净资产 + 有效业务价值——寿险的"账面价值"锚

  - id: ev_operating_variance
    name: EV营运偏差
    formula: ratio
    inputs: [ev_operating_variance_amount, embedded_value_opening]
    unit: pct
    direction: higher_better           # 正偏差=实际经营好于假设
    applies_to: [life]
    why: 实际经营(死亡/退保/费用)与精算假设的差；持续负偏差=假设过于乐观

  - id: csm
    name: 合同服务边际
    formula: passthrough
    inputs: [contractual_service_margin]
    unit: currency
    direction: higher_better
    applies_to: [life]
    why: IFRS17下未来利润的蓄水池，逐年摊销成利润；CSM增长=未来利润储备增厚
    na_when: [pre_ifrs17]              # 未执行IFRS17的报告期不适用

  - id: investment_yield_vs_assumption
    name: 投资收益率与精算假设之差
    formula: spread
    inputs: [total_investment_yield, actuarial_investment_assumption]
    unit: pct
    direction: higher_better
    applies_to: [life, pnc]
    bands:
      - {max: -1,  label: 显著低于假设, severity: high}   # 存量保单在失血
      - {min: -1,  max: 0, label: 略低, severity: mid}
      - {min: 0,   label: 达标或超出}
    why: 长期低于假设=存量保单亏损、EV将持续负偏差

  - id: regular_premium_ratio
    name: 期缴保费占比
    formula: ratio
    inputs: [regular_premium, first_year_premium]
    unit: pct
    direction: higher_better
    applies_to: [life]
    why: 期缴>趸交，保费质量高、价值高、更稳定

  - id: persistency_13m
    name: 13个月保单继续率
    formula: passthrough
    inputs: [persistency_rate_13m]
    unit: pct
    direction: higher_better
    applies_to: [life]
    bands:
      - {max: 85,  label: 偏低, severity: mid}
      - {min: 85,  max: 90, label: 正常}
      - {min: 90,  label: 优秀}
    why: 保单退保情况——继续率低=价值流失、销售误导风险

  # ── 财险：承保盈利 ──────────────────────────────
  - id: combined_ratio
    name: 综合成本率
    formula: sum_components
    inputs: [loss_ratio, expense_ratio]
    unit: pct
    direction: lower_better
    applies_to: [pnc]
    bands:
      - {max: 95,  label: 承保盈利良好}
      - {min: 95,  max: 100, label: 微利}
      - {min: 100, label: 承保亏损, severity: high}   # >100%=承保赔钱
    why: 财险生死线——<100%才承保盈利，>100%靠投资端补

  - id: loss_ratio
    name: 赔付率
    formula: ratio
    inputs: [claims_incurred, earned_premium]
    unit: pct
    direction: lower_better
    applies_to: [pnc]

  - id: expense_ratio
    name: 费用率
    formula: ratio
    inputs: [underwriting_expenses, earned_premium]
    unit: pct
    direction: lower_better
    applies_to: [pnc]

  - id: premium_growth
    name: 保费增速
    formula: yoy_growth
    inputs:
      current: earned_premium@latest
      prior:   earned_premium@yoy
    unit: pct
    direction: higher_better
    applies_to: [pnc]

# ── 红旗：保险特有的"假设美化/价值失真"信号（组合条件）──
red_flags:
  - id: assumption_manipulation
    name: 精算假设美化
    condition:                         # EV涨但营运偏差为负 + 投资收益不达假设
      - ev@yoy_growth > 0
      - ev_operating_variance < 0
      - investment_yield_vs_assumption < 0
    severity: high
    meaning: EV增长可能靠调整贴现率/收益率假设做出来，而非真实经营改善

  - id: premium_quality_deterioration
    name: 保费质量恶化
    condition:                         # 保费在涨但价值率和期缴占比在降
      - premium_growth > 0
      - nbv_margin@yoy_change < 0
      - regular_premium_ratio@yoy_change < 0
    severity: mid
    meaning: 靠趸交短险冲规模，看似增长实则价值稀释

  - id: underwriting_loss_masked
    name: 承保亏损被投资掩盖
    condition:
      - combined_ratio > 100
      - net_income_yoy > 0
    severity: mid
    meaning: 承保在亏钱，利润靠投资端撑，不可持续

# ── 估值 ─────────────────────────────────────────
valuation:
  primary: p_ev                        # P/EV，寿险标准估值法
  cross_check: [p_nbv, p_ev_percentile]
  pnc_primary: pb_combined_ratio       # 财险看PB并结合综合成本率
  note: 绝不用PE——当期利润因CSM/剩余边际摊销而失真

# ── 可预测性闸门（保险专用）────────────────────────
gates:
  assumption_integrity:
    - assumption_manipulation 触发  → escalate   # 先核实精算假设，估值结论暂缓

# ── 数据依赖（供取数层一次拉齐）─────────────────────
required_raw_fields:
  - new_business_value
  - first_year_premium_annualized
  - first_year_premium
  - regular_premium
  - embedded_value
  - embedded_value_opening
  - ev_operating_variance_amount
  - contractual_service_margin
  - total_investment_yield
  - actuarial_investment_assumption
  - persistency_rate_13m
  - claims_incurred
  - earned_premium
  - underwriting_expenses
  - net_income

framework_doc: ./SKILL.md
