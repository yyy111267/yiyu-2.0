# G2c 券商资管
特有指标

收入结构拆分（经纪/投行/资管/自营/两融各占比）
自营占比（beta 来源，越高业绩越随市场波动）
佣金率趋势（经纪业务的价，长期单边下滑）
两融余额及市占（信用业务规模）
AUM 及管理费率（资管业务，越来越重要的稳定收入）
全周期平均 ROE（单年无意义，同周期股逻辑）
要额外讲给大模型的

本质是强 beta 品种，单年数字信息量极低——牛市 ROE 20%、熊市 5%，用单年 PE 判断贵贱必错。必须看全周期均值，这点和周期股 G3 一样。
收入结构决定 beta 大小：自营占比高 = 靠天吃饭；资管/财富管理占比高 = 收入更稳、应享更高估值。同样是券商，结构不同估值逻辑不同。
自营亏损常被资管收入掩盖——要拆开看，别被合并利润骗了。
推理顺序：先判断当前市场处于周期什么位置 → 再看收入结构（beta 高低）→ 全周期 ROE → 估值分位。
估值用 PB 全周期分位，牛市高点永远显示低 PE（利润是峰值），是陷阱。
常见误判：牛市顶部看到"券商才 10 倍 PE 好便宜"——利润是峰值，分母马上归零。