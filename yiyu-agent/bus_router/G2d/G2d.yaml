G2d REIT
特有指标

FFO / AFFO（替代净利润，加回折旧后的真实可分配现金）
NOI 及 NOI Margin（净营业收入，物业层面盈利）
同物业 NOI 增长（剔除新购物业，看存量内生增长）
出租率 + 租金增长率
Cap Rate 资本化率 + 资产重估（估值锚）
WALE 加权平均租约到期期限（租约到期结构）
AFFO 派息覆盖率（派息可不可持续）
要额外讲给大模型的

净利润被折旧严重扭曲，必须用 FFO——物业每年计提大额折旧，但物业实际在增值，所以会计净利润远低于真实赚钱能力。看 REIT 只看 FFO/AFFO。
区分内生增长和外延收购：靠"同物业 NOI 增长"是真本事；靠不断买新物业撑规模，一旦停止收购增长就停。
靠资产重估做利润是危险信号——如果 FFO 不增长，全靠把物业估值调高来做利润，是纸面游戏。
派息超过 AFFO 不可持续——REIT 卖点是分红，但如果派息 > 可分配现金，是在透支。
对利率极度敏感（同 G1b，类债属性）：利率上行，Cap Rate 上行，资产估值下降，双杀。
推理顺序：FFO/AFFO 趋势 → 同物业 NOI（内生 vs 外延）→ 出租率+租约到期 → 派息覆盖 → 估值（P/FFO、NAV 折溢价、Cap Rate vs 无风险利率利差）。