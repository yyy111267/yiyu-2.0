G3 周期型
特有指标

全周期平均 ROIC/ROE（禁用单年，至少 7-10 年）
成本曲线分位（吨完全成本/C1现金成本 vs 行业分布）——周期股第一指标
全行业在建产能 + 全行业资本开支同比（供给端领先指标）
产品价差（螺纹-铁矿 / 乙烯-石脑油 / TCE运价 / 猪粮比）
产能利用率 + 全行业库存周期位置
谷底压力测试（用周期底部 EBITDA 算净债/EBITDA）
PB vs 重置成本（周期股正确的估值锚）
要额外讲给大模型的

单年利润几乎不含信息——顶部利润爆炸、底部亏损，都不代表常态。一切判断用全周期均值。
成本曲线位置决定生死：谷底时成本在行业最低 25% 分位的能活，最高 25% 的会破产。这比看利润重要得多。
供给端比需求端可靠：全行业资本开支收缩 = 下一轮上行的起点；疯狂扩产 = 下一轮暴跌预警。看供给别只看需求。
推理顺序：先判断周期位置（价差、库存、产能利用率）→ 看成本曲线分位（能不能活过谷底）→ 谷底压力测试（资产负债表）→ 全周期正常化估值。
估值用全周期正常化盈利×正常化PE，或 PB vs 重置成本。
最经典的陷阱（必须反复强调）：周期顶部利润最高、PE最低，看起来最便宜，其实是最危险的时候——利润是峰值，分母会归零。低PE买周期股 = 在山顶接盘。