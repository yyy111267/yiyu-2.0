# ============================================================
# G3 周期型 · 预热包（base_pack.yaml）
# 铁律：单年利润不含信息，一切用全周期均值/谷底压力测试。
# ============================================================

pack_name: G3-base-pack
group: G3
extends: core

# ── 一、core 通用（周期股会继承，但解读要切周期视角）────────
core_metrics:
  - roic_vs_wacc
  - net_debt_to_ebitda        # 平时杠杆（谷底测试见 step2）
  - ocf_to_net_income

# ── 二、周期核心（正常化盈利 + 谷底压力测试）───────────────
step2_business_essence:
  - normalized_earnings_7y    # 正常化盈利：禁用单年
  - trough_net_debt_to_ebitda # 谷底净债/EBITDA：周期股生死线
  - utilization               # 产能利用率：周期位置
  - roic_volatility_10y       # ROIC 波动：确认底部不致命

# ── 三、第7步·估值（正常化PE，禁当期PE）───────────────────
step7_valuation:
  - normalized_pe             # 正常化PE：唯一有意义的PE

# ── 取数依赖 ────────────────────────────────────────────
required_raw_fields:
  - net_profit
  - current_price
  - normalized_earnings_ps
  - total_debt
  - cash
  - trough_ebitda
  - actual_output
  - capacity
  - ebit
  - tax_rate
  - total_equity
