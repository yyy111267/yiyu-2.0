G4 平台/网络效应
特有指标

MAU/DAU + DAU/MAU 黏性 + 留存曲线（次日/30日/12月）
ARPU + 货币化率/take rate + GMV（注意 GMV ≠ 收入）
单位经济 UE（单用户/单订单扣除履约和获客后的贡献利润）
LTV/CAC（>3）+ CAC 回收期
经营杠杆（收入增速 − 经营费用增速 > 0）
SBC/收入 + 稀释股本年化增速（摊薄）
云/SaaS业务加：NDR/NRR（>110%）、Rule of 40
要额外讲给大模型的

区分真假网络效应（最重要）：真网络效应 = 用户越多，产品对每个存量用户越有价值（社交、交易撮合）；假的 = 靠规模+补贴（外卖、社区团购、共享出行），撤补贴用户就走。检验方法：用户增加是否让存量用户体验变好。 这决定了护城河真伪。
GMV ≠ 收入：GMV 是流水，收入 = GMV × take rate。别把 GMV 增长当收入增长，还要盯 take rate 有没有下滑。
SBC 是隐形成本，必须盯：收入涨 30% 但股本涨 8%，每股价值只涨 20%。很多平台用加回 SBC 美化 Non-GAAP 利润。
留存是网络效应唯一的硬证据——增长可以买，留存买不来。留存曲线走平说明有真需求。
推理顺序：先判断真假网络效应 → 看留存和黏性（护城河真伪）→ 单位经济 UE 和 LTV/CAC（能不能赚钱）→ 经营杠杆（规模效应有没有兑现）→ 摊薄修正 → 估值。
多业务平台必须 SOTP 分部估值（电商+云+广告不能混在一起给一个PE）。