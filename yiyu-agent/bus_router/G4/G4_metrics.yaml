# ============================================================
# 商业模式文件：G4 平台/软件
# 核心：网络效应真伪 + 留存 + 单位经济 + 摊薄修正
# ============================================================

group: G4
name: 平台/软件
extends: core

identity:
  one_liner: 网络效应或订阅模式，单位经济决定盈亏，边际成本趋零
  value_source: 用户资产 + 货币化能力（take rate/ARPU）
  kill_variables:
    - 真假网络效应（用户增加是否让存量用户变好）
    - 留存（增长可以买，留存买不来）
  representative_industries:
    - 互联网平台：腾讯、阿里巴巴、美团、拼多多、京东
    - 软件SaaS：金山办公、用友、金蝶
    - 游戏：网易、三七互娱、世纪华通
    - 云：优刻得、金山云
  special_note: GMV≠收入；SBC是隐形成本必须盯；多业务平台必须SOTP

metrics:

  # ── 单位经济（能不能赚钱）─────────────────────────
  - id: sbc_to_revenue
    name: 股权激励占收入比
    formula: ratio
    inputs: [stock_based_compensation, revenue]
    unit: pct
    direction: lower_better
    why: SBC是隐形成本，很多平台靠加回SBC美化Non-GAAP利润

  - id: diluted_shares_cagr
    name: 稀释股本复合增速
    formula: cagr
    inputs: [weighted_average_shares_diluted@series_10y]
    unit: pct
    direction: lower_better
    why: 收入涨30%但股本涨8%，每股价值只涨20%——摊薄吃掉增长

  - id: ocf_to_net_income
    name: 经营现金流/净利润
    formula: ratio
    inputs: [operating_cash_flow, net_profit]
    unit: x
    direction: higher_better
    why: 平台利润常含大量SBC和投资收益，现金流是含金量检验

  - id: revenue_growth
    name: 收入增速
    formula: yoy_growth
    inputs:
      current: revenue@latest
      prior: revenue@yoy
    unit: pct
    direction: higher_better
    why: 成长是平台估值的基础，但要结合留存看质量

  # ── 经营杠杆（规模效应有没有兑现）──────────────────
  - id: operating_leverage
    name: 经营杠杆
    formula: spread
    inputs: [revenue_growth, expense_growth]
    unit: pct
    direction: higher_better
    why: 收入增速−经营费用增速>0 → 规模效应在兑现

# ── 红旗 ─────────────────────────────────────────
red_flags:
  - id: sbc_masking_losses
    name: SBC掩盖亏损
    condition:
      - sbc_to_revenue > 5
      - net_profit < 0
    severity: high
    meaning: Non-GAAP盈利靠加回SBC美化，真实经营在亏损

# ── 估值 ─────────────────────────────────────────
valuation:
  primary: ev_ebitda_adj         # 调整后EV/EBITDA（加回SBC）
  cross_check: [ps, dcf]
  note: 多业务平台必须SOTP分部估值，不能混在一起给一个PE

# ── 取数依赖 ────────────────────────────────────
required_raw_fields:
  - stock_based_compensation
  - revenue
  - weighted_average_shares_diluted
  - operating_cash_flow
  - net_profit
  - expense_growth

framework_doc: ./SKILL.md
