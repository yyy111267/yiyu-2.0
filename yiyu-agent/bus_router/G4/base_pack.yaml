# ============================================================
# G4 平台/软件 · 预热包（base_pack.yaml）
# 核心：SBC/摊薄/现金流质量/经营杠杆（可自动算的部分）
# 说明：MAU/DAU/留存/ARPU/LTV-CAC 等需外部运营数据，由 LLM 在
#       calc.run_code 沙箱里结合 web 搜索计算，不进自动 base_pack。
# ============================================================

pack_name: G4-base-pack
group: G4
extends: core

# ── 一、core 通用 ─────────────────────────────────────────
core_metrics:
  - roic
  - roic_vs_wacc
  - ocf_to_net_income
  - fcf_to_net_income
  - net_debt_to_ebitda
  - revenue_volatility_10y

# ── 二、平台特有（可自动算的）───────────────────────────────
step2_business_essence:
  - revenue_growth            # 收入增速
  - sbc_to_revenue            # SBC/收入：隐形成本
  - diluted_shares_cagr       # 摊薄
  - operating_leverage        # 经营杠杆

# ── 三、第7步·估值（交叉验证）─────────────────────────────
step7_valuation: []

# ── 取数依赖 ────────────────────────────────────────────
required_raw_fields:
  - stock_based_compensation
  - revenue
  - weighted_average_shares_diluted
  - operating_cash_flow
  - net_profit
  - expense_growth
  - ebit
  - tax_rate
  - total_debt
  - total_equity
  - cash
  - ebitda
