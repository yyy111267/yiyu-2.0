# ============================================================
# G5 早期硬科技·未盈利成长 · base_pack + step2/step7 分区
# 属于 skill: skills/stage-preprofit/（叠加包，叠在原业务组上）
# 商业模式主键：当期亏损、价值在未来、现金跑道是硬约束
# 估值范式：收入拐点DCF / PS（★禁用 PE/ROE/FCF 全部，亏损无意义）
# 关键对比点：ROE/FCF 不是"差"，是"不可计算"——必须区分 NOT_APPLICABLE
# ============================================================

group: G5
name: 早期硬科技·未盈利成长
type: overlay                        # ★叠加包：不独立，叠在 G4/G6/医药 等原组上
inherits_core: partial              # 只继承core的"生存力"维度，禁用回报类
core_disabled:                      # ★这些不是差，是不可计算
  - roic                            # 分母为负/无意义
  - roe                             # 亏损，NOT_APPLICABLE
  - fcf_to_net_income               # 净利为负
  - owner_earnings

# ── 第2步："生意本质"（看斜率，不看绝对值）──────────
step2_business_essence:
  essence_one_liner: 烧钱换增长、赌未来单位经济转正的期权型生意
  value_source: 未来现金流的期权价值 + 单位经济改善斜率

  key_metrics:
    - id: revenue_growth_2y
      name: 近2年收入增速
      formula: cagr
      inputs: [revenue@series_2y]
      availability: direct
      read: 须>40%连续2年才入"成长通道"；再看二阶导是否减速

    - id: revenue_quality
      name: 收入质量
      formula: revenue_quality_split
      inputs: [revenue, related_party_revenue, government_subsidy_revenue]
      availability: text            # 关联方/政府补贴占比藏在年报附注
      read: 真实商业化收入 vs 补贴/关联方/政府订单撑起来的

    - id: gross_margin_slope
      name: 毛利率斜率
      formula: linear_slope
      inputs: [gross_margin@series_3y]
      availability: derive
      read: ★斜率比绝对值重要；毛利率为负=规模化解决不了=硬否决

    - id: unit_economics
      name: 单位经济UE
      formula: unit_economics
      inputs: [contribution_per_unit, cac]
      availability: proxy           # A股多无CAC，用销售费用/新增客户近似
      read: 单客户/单订单扣除获客后是否有转正路径

    - id: rd_expense_ratio
      name: 研发费用率
      formula: ratio
      inputs: [rd_expense, revenue]
      availability: direct
      read: 投入强度；同时查研发资本化比例(美化利润红旗)

    - id: operating_leverage_pre
      name: 经营杠杆(Rule of 40 for SaaS)
      formula: rule_of_40
      inputs: [revenue_growth, operating_margin]
      availability: derive
      read: 收入增速+利润率≥40%为SaaS金标准

  narrative_prompts:
    - 竞争对手拿100亿+3年能否追平？（护城河窗口期>强度）
    - 收入里多少是真商业化，多少是补贴/关联方撑的？

# ── 第7步："估值"（★禁PE/ROE/FCF，用现金跑道+拐点）────
step7_valuation:
  primary_model: revenue_inflection_dcf    # 收入拐点DCF
  forbidden: [pe, roe_based, fcf_based]    # ★全禁，亏损无意义
  safety_margin_anchor: 现金可支撑月数 + 盈利拐点可证伪性
  hard_rule: 无明确盈利时间表的高估值公司→降为"期权型/观察"，禁止核心仓位建议

  key_metrics:
    - id: cash_runway_months
      name: 现金可支撑月数
      formula: cash_runway
      inputs: [cash_and_equivalents, monthly_operating_cash_burn]
      availability: derive
      read: ★= 现金/月均经营现金流出；<18个月=融资风险重大(头号杀手)

    - id: ps_ttm
      name: 市销率TTM
      formula: ratio
      inputs: [total_market_cap, revenue@ttm]
      availability: derive
      read: PS>15x且增速<100%谨慎；PS>30x需极强护城河论证(结合NDR/UE不可一刀切)

    - id: dilution_speed
      name: 股本摊薄速度
      formula: cagr
      inputs: [total_shares@series_3y]
      availability: direct
      read: 靠股权融资烧钱，摊薄是隐形损失；看历次融资每股价格趋势

    - id: revenue_inflection_pe
      name: 收入拐点反推合理PS
      formula: inflection_dcf
      inputs: [revenue@ttm, steady_state_net_margin, wacc, years_to_inflection]
      availability: compute
      read: 假设3-5年后达行业稳态净利率(软件20-25%/硬件8-12%)，倒推当前合理PS

    - id: milestone_progress
      name: 里程碑转化
      formula: milestone_tracker
      inputs: [pipeline_stage]
      availability: text
      read: 硬科技看定点→流片→小批量→量产；创新药看临床阶段+现金能否撑到下个readout

# ── 预热包 ──────────────────────────────────────
# 对比G1a/G1b：完全没有PE/股息/正常化盈利，核心是现金跑道和增长质量
base_pack:
  - core.survival_only              # 只取core的生存力维度(净债/利息保障)
  - revenue_growth_2y
  - gross_margin_slope
  - rd_expense_ratio
  - cash_runway_months              # ★最优先
  - ps_ttm
  - dilution_speed

# ── 叠加规则：作为overlay如何与原业务组组合 ──────────
overlay_rule:
  base_group_provides: 行业专属维度(如G4的网络效应、G6的产能/技术路线)
  this_overlay_provides: 未盈利阶段的估值与生存力替换
  example:
    - 早期SaaS = G4(平台) + G5(overlay)   # 用G4的留存/UE + G5的现金跑道/禁PE
    - 创新药   = 医药   + G5(overlay)      # 用医药的管线rNPV + G5的现金跑道
  transition: 连续4季净利>0且OCF>0 → 摘除G5 overlay，回归原组正常估值

framework_doc: ./SKILL.md
