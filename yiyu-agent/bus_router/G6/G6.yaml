G6 高端制造/硬件
特有指标

book-to-bill 订单出货比（>1 需求旺）+ 订单能见度月数
产能利用率（毛利率第一解释变量）
折旧占收入比 + 折旧年限 vs 同业（拉长年限 = 美化利润）
研发资本化比例（比例高 = 美化利润）
固定资产周转率 + 单位capex产出
客户集中度（前五大占比）
国产替代份额 + 单价年降幅（汽零/消电对下游年降的承受力）
要额外讲给大模型的

重资产 + 折旧刚性 → 毛利率对产能利用率极度敏感：产能跑满毛利好看，空置就难看。所以毛利率放宽标准，不是"降低要求"，而是这类公司回报体现在资产周转和产能利用率上，不在毛利率上。
两个利润美化红旗必须查：① 拉长折旧年限（本该10年提折旧改成15年）；② 研发费用资本化（本该费用化的研发计入资产）。两者都能凭空做高利润。要和同业比。
订单 ≠ 收入：book-to-bill 高是好事，但订单可取消、可延期，不能直接当收入确认。
技术代际风险是最大杀手：一代技术押错方向就出局（面板、存储、光伏都有先例）。要判断它在不在主流技术路线上。
推理顺序：先看订单（book-to-bill、能见度）→ 产能利用率（解释毛利率）→ 查两个利润美化红旗 → 技术路线是否主流 → 客户集中度风险 → 周期调整估值。
估值用周期调整PE或EV/EBITDA（折旧政策差异大时 EBITDA 更可比），下行期用 PB。