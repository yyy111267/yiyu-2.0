# ============================================================
# G6 高端制造/硬件 · 预热包（base_pack.yaml）
# 核心：产能利用率 + 资产周转 + 折旧强度 + ROIC
# ============================================================

pack_name: G6-base-pack
group: G6
extends: core

# ── 一、core 通用 ─────────────────────────────────────────
core_metrics:
  - roic
  - roic_vs_wacc
  - ocf_to_net_income
  - fcf_to_net_income
  - net_debt_to_ebitda
  - interest_coverage

# ── 二、制造特有（产能/周转/折旧）───────────────────────────
step2_business_essence:
  - utilization               # 产能利用率
  - fixed_asset_turnover      # 固定资产周转率
  - depreciation_to_revenue   # 折旧占收入比（利润美化红旗）
  - capex_intensity           # 资本开支强度

# ── 三、第7步·估值（EV/EBITDA 交叉验证）────────────────────
step7_valuation: []

# ── 取数依赖 ────────────────────────────────────────────
required_raw_fields:
  - actual_output
  - capacity
  - revenue
  - fixed_assets
  - depreciation_amortization
  - capital_expenditure
  - ebit
  - tax_rate
  - total_debt
  - total_equity
  - cash
  - operating_cash_flow
  - net_profit
  - ebitda
  - interest_expense
