# MVP 研究领域目录。Adapter 是价值投资研究策略，不是完整的证监会行业分类。
# 行业领域、商业模式、发展阶段和事件 Overlay 分层组合，不再混成一个标签。

adapters:
  - adapter_id: consumer_brand
    name: 消费品牌
    status: active
    description: 靠品牌、信任、体验或渠道可得性获得溢价，且具有可验证复购的消费生意。
    applicable_conditions:
      - 终端品牌与重复消费是主要经济引擎
      - 价格、份额、复购和渠道健康可以被验证
    excluded_conditions:
      - 主要靠原材料价格、产能周期、代工或一次性项目获利
      - 只有消费品属性而没有终端品牌溢价
    priority_questions:
      - 品牌为客户解决什么问题，复购和溢价能否持续？
      - 护城河来自心智、渠道、产品还是网络，哪些证据可以证伪？
      - 品牌价值是否转化为持续 ROIC、现金流和每股价值？
      - 管理层的渠道投入、并购、分红和回购记录如何？
      - 当前价格隐含了怎样的量、价、份额和利润率假设？

  - adapter_id: digital_software_platform
    name: 数字软件与平台
    status: active
    description: 软件、SaaS、AI 原生产品、大模型、云服务或互联网平台为主要经济引擎的业务单元。
    applicable_conditions:
      - 收入主要来自订阅、授权、API/按量、广告、抽佣或云服务
      - 产品价值主要由软件、数据、流量、网络或客户工作流产生
    excluded_conditions:
      - 只把 AI 作为功能或营销标签的非数字主业
      - 芯片、服务器等硬件销售是主要利润来源
      - 综合集团整体未拆分业务单元
    priority_questions:
      - 先锁定订阅、按量、广告、抽佣、云或交付型收费模式，它们的经济性是什么？
      - 留存、使用、网络效应、数据和切换成本能否证明持久护城河？
      - 扣除云/推理、获客、交付和 SBC 后，单位经济和每股价值是否改善？
      - 集团公司是否已按游戏、广告、云、金融科技等业务单元拆分？
      - 当前估值对稳态增长、利润率、再投资和稀释的隐含假设是什么？

  - adapter_id: semiconductor
    name: 半导体与算力硬件
    status: active
    description: 芯片设计、IDM/晶圆制造、封测、存储和算力硬件业务。
    applicable_conditions:
      - 主营来自芯片设计、制造、封测、存储或算力硬件
      - 技术路线、客户认证、库存或制造产能是重要价值驱动
    excluded_conditions:
      - 纯软件、云服务或消费电子整机品牌
    priority_questions:
      - 公司属于 Fabless、IDM/Foundry、封测、存储还是算力硬件？
      - 护城河来自 IP、工艺、良率、认证、规模还是生态，能持续多久？
      - 需求、出货、价格和库存分别说明什么周期位置？
      - 中周期 ROIC 能否覆盖资本成本，新一轮研发/扩产是否创造价值？
      - 当前价格隐含的中周期利润、份额和技术成功假设是什么？

  - adapter_id: advanced_manufacturing
    name: 高端制造
    status: active
    description: 高技术/工艺壁垒、客户认证或复杂交付显著的制造业，包括机器人、专用设备、精密零部件、汽车整车和零部件。
    applicable_conditions:
      - 主要价值来自工艺、工程化、认证、产品平台、交付或服务
      - 价值链位置是零部件、设备、整机/整车或系统集成
    excluded_conditions:
      - 纯软件、消费品牌、大宗商品或无差异化代工
      - 半导体芯片与晶圆制造
    priority_questions:
      - 先判断是机器人/自动化、专用设备、精密零部件、整车还是汽车零部件？
      - 护城河是工艺、认证、平台、规模、渠道还是服务，转换成本是否真实？
      - 订单、定点、产能、交付、验收和回款中哪一步才是可验证的价值转化？
      - 价格年降、良率、产品结构和产能利用率对长期 ROIC 有何影响？
      - 当前价格隐含的份额、单车/单机价值量、利润率和再投资假设是什么？

  - adapter_id: generic
    name: 通用价值投资
    kind: fallback
    status: active
    description: 当前四个 MVP 领域不适用或证据不足时，只使用通用价值投资框架，不加载行业包。
    applicable_conditions:
      - 金融、医药、资源、公用事业等尚未深度覆盖的领域
      - 行业或商业模式分类置信度不足
    excluded_conditions: []
    priority_questions: []

