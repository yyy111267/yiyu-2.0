## 价值投资通用指标（除G2类企业）
## ROIC、ROIC vs WACC、增量 ROIC（新投入资本的回报）
## OCF/净利润（利润含金量）、FCF/净利润
## 应计项占比（利润里有多少不是真金白银）
## 所有者收益（净利 + 折旧摊销 − 维持性 capex − 增量营运资本）
## 稀释后股本 5–10 年变化、SBC/收入（股权稀释）
## 净债/EBITDA、利息保障倍数
## 留存收益的市值转化（留 1 元创造了多少市值）
## 10 年 ROIC 标准差、毛利率波动（稳定性 = 可预测性）
# ============================================================
# ★ metrics 入池规则（防"全量可选指标库"死配置卷土重来）★
# 每个组 yaml 的 metrics 段是"解读协议"，不是"指标百科全书"：
#   1. 只准放 5-8 个「本组必算 + 有标准口径 + 有档位」的指标；
#   2. 新增必须同时满足三条：有冻结函数（formulas_core / formulas_<组> 里已实现）、
#      有数值→档位解读、本组分析真的每次都看——缺一条就不入池，
#      改为让 LLM 在 run_code 沙箱里现算（优先调可信函数库，不自己手写公式）；
#   3. 有口径陷阱的（ROIC / TTM差分 / 正常化盈利 / 应计项）一律走冻结函数。
# 分界线只有一条：有标准口径的 → 固定函数（防漂移）；纯非标临时的 → LLM 现算。
# ============================================================
# 通用底座：core（价值投资 Layer 0）
# 作用：定义「与行业无关、任何非金融公司都该算」的价值投资核心指标
# 谁继承它：所有非金融组（G1a/G1b/G3/G4/G6...）通过 extends: core 继承
# 谁不继承：G2 金融四子类（会计结构不同，用 extends: null 整体替换）
#
# 核心思想：这一层衡量的不是"行业特色"，而是"价值投资框架本身关心什么"：
#   1) 资本回报够不够高、能不能持续     → ROIC vs WACC、增量ROIC
#   2) 利润是不是真金白银              → 现金质量、应计项
#   3) 每股价值有没有被稀释/回购创造    → 股本变化、SBC
#   4) 公司能不能活下去                → 生存力、利息保障
#   5) 未来能不能预测（能不能估值）      → 可预测性闸门
# ============================================================

group: core
name: 价值投资通用底座
extends: null                      # 底座本身不继承任何东西

identity:
  one_liner: 与行业无关的价值投资核心指标，衡量资本回报/现金质量/生存力/每股价值/可预测性
  applies_to: 所有非金融公司
  not_applies_to: [G2a, G2b, G2c, G2d]   # 金融四子类不用这套

## 维度1：资本回报：不是赚得多就好，是赚的回报率要持续高于资本成本。
## ROIC存量回报	公司过去投进去的钱，现在每年能赚回多少	你投100万开奶茶店，每年净赚15万，ROIC=15%
## ROIC vs WACC经济利润差	赚的回报率 vs 借钱/融资的成本，差值是"真赚钱"还是"白忙活"	ROIC=15%，WACC=8%，差7%就是经济利润；反过来ROIC< WACC就是在毁灭价值
## 增量ROIC新投入回报	新投的钱（扩产、新业务）能赚回多少，比存量ROIC更重要	老店ROIC=15%，新开店只赚5%，说明扩张在稀释价值


## 维度2:现金质量 ： 利润是真金白银还是纸面数字？利润可以会计操纵，现金流很难造假。OCF/净利润 > 1 是健康标志。
## OCF/净利润	经营现金流 ÷ 净利润，衡量利润"含金量"	净利润1亿，经营现金流1.2亿，说明利润扎实；如果只有0.5亿，说明很多是应收账款
## FCF/净利润	自由现金流 ÷ 净利润，扣掉资本开支后还剩多少真钱	净利润1亿，FCF 0.8亿，说明80%利润能变成现金；如果FCF为负，说明一直在烧钱
## 应计项占比	应收账款+存货等"非现金"项目占利润的比例，越高越危险	应计项占比30%以上，说明利润里"水分"较大
## 有效税率质量	实际交税 vs 法定税率，异常低可能靠避税或补贴	法定25%，实际只有10%，要查是不是靠税收优惠或关联交易
## 现金转换周期	从买原材料到收回销售款的天数，越短越好	茅台几乎0天（先收款后发货），烂公司可能180天以上


## 维度3：每股价值 —— "公司每投一块钱，股东价值增了多少？"公司赚的钱，要么分给股东（分红），要么再投资创造更多价值。如果两都不沾，就是浪费股东资本。
## 稀释股本CAGR	总股本每年增长多少，增长太快=稀释股东	股本10年翻3倍，但利润只翻1.5倍，每股价值被稀释
## SBC/收入	股权激励成本 ÷ 收入，衡量"画饼"对股东的侵蚀	SBC/收入 > 5% 就要警惕，说明管理层在大量发股激励
## 留存收益市值转化	公司留存的利润，转化成了多少市值	留存10亿，市值只增5亿，说明资本配置效率差
## 回购时机评估	公司回购股票是在高位还是低位，决定是"真爱"还是"护盘"	低位回购=管理层认为被低估；高位回购=可能是在掩盖业绩

## 4. 生存力 —— "公司会不会破产？"价值投资先保证不亏大钱，生存力是底线。
## 净债/EBITDA	净债务 ÷ 息税折旧摊销前利润，衡量还债需要几年	净债/EBITDA < 3倍安全；> 5倍危险
## 利息保障倍数	EBIT ÷ 利息费用，衡量赚的钱够不够付利息	倍数 > 5倍安全；< 1.5倍有违约风险


## 维度5：可预测性 —— "未来10年我能大概猜出公司赚多少钱吗？"价值投资买的是未来现金流的折现，可预测性越高，折现率越低，估值越安全。
## ROIC十年波动	过去10年ROIC的波动幅度，波动越小越好	茅台ROIC十年都在25-30%之间，波动极小；周期股可能10%-40%大幅波动
## 毛利率十年波动	毛利率10年波动幅度，稳定=护城河稳定	品牌消费毛利率通常稳定在40-60%；制造业可能20-50%大幅波动
## 收入十年变异系数	收入增长的波动程度，变异系数<20%算稳定	变异系数高说明收入大起大落，预测难度大

## 维度6：闸门与红旗 —— "哪些信号说明公司可能出问题了？"
## 可预测性降级规则	原本稳定的公司，ROIC/毛利率开始大幅波动	护城河可能正在被侵蚀，比如新竞争对手出现
## 有利润没现金	净利润增长但经营现金流不增反降	利润可能是应收账款堆出来的，随时可能坏账
## 摊薄吞噬增长	收入增长但每股收益不增，说明股本在稀释	可能是频繁发股融资，股东价值被稀释
## 税率异常	有效税率突然大幅变化	可能靠一次性收益或关联交易操纵利润
## 核心逻辑： 这些是早期预警信号，出现1-2个要警惕，出现3个以上基本可以排除。


metrics:

  # ── 维度1：资本回报（价值创造的核心）───────────────
  - id: roic
    name: 投入资本回报率
    formula: roic
    inputs: [ebit, tax_rate, total_debt, total_equity, cash]   # 口径写死在函数：NOPAT=EBIT×(1−tax)，投入资本=有息负债+权益−超额现金
    unit: pct
    direction: higher_better
    bands:
      - {max: 8,   label: 毁灭价值, severity: high}   # 低于WACC≈毁灭价值
      - {min: 8,   max: 15, label: 一般}
      - {min: 15,  max: 25, label: 良好}
      - {min: 25,  label: 优秀}
    why: 价值投资第一指标——赚的钱能否覆盖资本成本
    na_when: [invested_capital_non_positive]

  - id: roic_vs_wacc
    name: ROIC减WACC(经济利润差)
    formula: spread
    inputs: [roic, wacc]
    unit: pct
    direction: higher_better
    why: 正值才是真正创造价值；持续为正才有护城河

  - id: incremental_roic
    name: 增量ROIC
    formula: incremental_roic
    inputs: [ebit_change, invested_capital_change]
    unit: pct
    direction: higher_better
    why: 新投入的每一块钱回报如何——比存量ROIC更看未来
    na_when: [invested_capital_change_near_zero]

  # ── 维度2：现金质量（利润是不是真的）─────────────
  - id: ocf_to_net_income
    name: 经营现金流/净利润
    formula: ratio
    inputs: [operating_cash_flow, net_profit]   # 字段名与数据源对齐（westock/东财用 net_profit）
    unit: x
    direction: higher_better
    bands:
      - {max: 0.7,  label: 利润含水, severity: high}
      - {min: 0.7,  max: 1.0, label: 偏弱, severity: mid}
      - {min: 1.0,  label: 健康}
    why: 长期<1说明利润没有现金支撑，可能是应收/存货堆出来的

  - id: fcf_to_net_income
    name: 自由现金流/净利润
    formula: fcf_conversion
    inputs: [operating_cash_flow, capital_expenditure, net_profit]
    unit: x
    direction: higher_better
    why: 扣掉维持性投资后，利润能沉淀多少真金白银

  - id: accruals_ratio
    name: 应计项占比
    formula: accruals
    inputs: [net_profit, operating_cash_flow, total_assets]
    unit: pct
    direction: lower_better
    why: 应计项越高，盈余质量越差，是财务操纵的经典信号

  - id: owner_earnings
    name: 所有者收益
    formula: owner_earnings
    inputs: [net_income, depreciation_amortization, maintenance_capex, working_capital_change]
    unit: currency
    direction: higher_better
    why: 巴菲特口径——净利+折旧摊销-维持性capex-增量营运资本，真正可分配给股东的钱

  # ── 维度3：每股价值（稀释是头号杀手）──────────────
  - id: diluted_shares_cagr
    name: 稀释股本复合增速
    formula: cagr
    inputs: [weighted_average_shares_diluted@series]
    unit: pct
    direction: lower_better
    bands:
      - {max: 0,   label: 净回购(股东友好)}
      - {min: 0,   max: 2, label: 轻微摊薄}
      - {min: 2,   label: 显著摊薄, severity: mid}
    why: 收入涨30%但股本涨8%，每股价值只涨20%——摊薄吃掉增长

  - id: sbc_to_revenue
    name: 股权激励占收入比
    formula: ratio
    inputs: [stock_based_compensation, revenue]
    unit: pct
    direction: lower_better
    why: SBC是隐形成本，很多公司靠加回SBC美化Non-GAAP利润

  - id: buyback_vs_intrinsic
    name: 回购价vs内在价值
    formula: buyback_value_creation
    inputs: [common_stock_repurchased, avg_price, intrinsic_value_estimate]
    why: 低于内在价值回购创造价值，高位回购摧毁价值

  # ── 维度4：生存力（能不能活下去）───────────────
  - id: net_debt_to_ebitda
    name: 净债/EBITDA
    formula: net_debt_to_ebitda
    inputs: [total_debt, cash, ebitda]
    unit: x
    direction: lower_better
    bands:
      - {max: 1,   label: 稳健}
      - {min: 1,   max: 3, label: 正常}
      - {min: 3,   max: 4, label: 偏高, severity: mid}
      - {min: 4,   label: 高风险, severity: high}
    na_when: [ebitda_non_positive]

  - id: interest_coverage
    name: 利息保障倍数
    formula: interest_coverage    # 专用函数：财务费用≤0(净现金公司)判NA，不算出负倍数打危险
    inputs: [ebit, interest_expense]
    unit: x
    direction: higher_better
    bands:
      - {max: 2,   label: 危险, severity: high}
      - {min: 2,   max: 5, label: 一般}
      - {min: 5,   label: 安全}
    na_when: [interest_expense_near_zero]     # 无有息负债时不适用

  # ── 维度5：资本配置（capex方向由各组override）──────
  - id: capex_intensity
    name: 资本开支强度
    formula: ratio
    inputs: [capital_expenditure, revenue]
    unit: pct
    direction: neutral               # ★底座保持中性，各组override成 higher/lower better
    why: 品牌消费越低越好、公用事业越高越好——方向由行业决定，底座不预设

  # ── 维度6：可预测性（能不能估值的前置闸门）─────────
  - id: roic_volatility_10y
    name: ROIC十年波动率
    formula: stdev
    inputs: [roic@series_10y]
    unit: pct
    direction: lower_better
    bands:
      - {max: 3,   label: 高度可预测}
      - {min: 3,   max: 8, label: 中等}
      - {min: 8,   label: 不可预测, severity: high}   # 触发能力圈闸门
    why: 波动过大→安全边际无法定义→降级为"观察"而非"低估/买入"
    na_when: [insufficient_history]

  - id: revenue_volatility_10y
    name: 收入十年变异系数
    formula: coefficient_of_variation
    inputs: [revenue@series_10y]
    unit: pct
    direction: lower_better
    why: 收入越稳，未来现金流越可估

# ── 通用红旗 ─────────────────────────────────────
red_flags:
  - id: profit_without_cash
    name: 有利润没现金
    condition:
      - ocf_to_net_income < 0.7
      - accruals_ratio > 0.1
    severity: high
    meaning: 利润是账面堆出来的，现金没进来

  - id: dilution_eats_growth
    name: 摊薄吞噬增长
    condition:
      - diluted_shares_cagr > 3
      - sbc_to_revenue > 5
    severity: mid
    meaning: 增长大部分被股权稀释稀释掉了

# ── 通用估值（各组可覆盖primary）──────────────────
valuation:
  primary: dcf
  cross_check: [pe_normalized, ev_ebit, fcf_yield]
  note: 各组通过 valuation.primary 指定更合适的模型

# ── 可预测性闸门（价值投资的能力圈约束）──────────────
# 不通过时不输出"低估/买入"，只输出"超出能力圈/仅供观察"
gates:
  predictability:
    - roic_volatility_10y.band == 不可预测  → downgrade
    - insufficient_10y_history              → downgrade
