叠加包（特殊结构：不独立，叠在原组上）
pre_profit 未盈利成长
它和前面所有组的本质区别：它不是一个独立的组，而是一个叠加层。一家公司 = 原来的业务组（G4/G6/医药…）+ pre_profit 标记。它做两件事：禁用原组里算不了的指标（ROE/FCF/正常估值），新增一套成长通道指标。

特有指标（成长通道7指标，替换 ROE/FCF 硬门槛）

收入增速 + 增速二阶导（是否在减速）+ 收入质量（真实商业化 vs 补贴/关联方/政府订单）
毛利率斜率（斜率比绝对值重要；毛利率为负 = 硬否决）
单位经济 UE 及转正路径
经营杠杆（收入增速 − 费用增速）/ Rule of 40（SaaS）
现金跑道（月）= 现金 / 月均经营现金消耗（<18个月 = 融资风险重大）
摊薄（稀释股本年化增速 + SBC/收入 + 历次融资每股价格趋势）
里程碑转化（硬科技看定点→流片→小批量→量产；创新药看临床阶段推进）

要额外讲给大模型的（最重要的是最后一条）

ROE/FCF 为负是"不可计算"，不是"差"——这两者在系统里必须区分。不要因为 ROE 为负就扣分，它本来就该是负的。
现金跑道是硬约束：< 18 个月就是重大融资风险，不管故事多好。先算它还能烧多久。
看斜率不看绝对值：毛利率从 20% 升到 35% 比"毛利率 40% 但在下滑"更好。单位经济在改善的方向，比当前水平重要。但毛利率为负是硬否决——规模化解决不了负毛利。
摊薄是隐形损失：这类公司靠不断股权融资烧钱，每融一轮老股东被稀释。要看历次融资的每股价格趋势和股本膨胀速度。
收入质量要拆：AI/硬科技早期收入里，多少是真商业化，多少是关联方、政府补贴订单撑的。
⭐最关键的设计约束：这类公司不输出"低估/买入"结论——因为无当期现金流、无法定义安全边际，强行估值就是赌博。只输出"是否值得跟踪 + 什么条件触发重新评估"。这是它和其他所有组最根本的区别，也是价值投资能力圈的底线。
估值用 rNPV/情景概率加权、反向DCF（倒推"要成立需要什么假设"，再判断假设荒不荒谬），绝不用当期 PE。
创新药额外讲：管线 rNPV、专利悬崖、单适应症峰值销售、BD授权首付款（第三方验证信号）。
SaaS 额外讲：NDR>110%、Magic Number、CAC 回收期<24月、Churn。