cases:
- id: MET-001
  name: 指标计算/ROE TTM平均净资产口径
  skill: deep-research
  desc: '[T1/正向] 路由=research_task → deep-research｜判分=规则判分：数值、公式、字段和工具参数精确匹配；任一口径错误即失败。'
  setup:
    前置条件: 已锁定实体 TEST001.SH；允许使用财务快照和计算工具。
    数据快照: 归母净利润TTM=12亿元；期初归母净资产=80亿元；期末归母净资产=100亿元；数据均来自同一报告期。
    来源: 指标字典.md 1.1、C1；toolkit/calc/metric.py
  input:
    message: 请计算示例公司最新TTM ROE，并说明口径。
    metadata:
      case_type: 正向
      stage: T1
  expect:
    must_output:
    - ROE=13.33%
    must_not_output:
    - 用期末净资产直接相除
    must_do:
    - 必须由工具计算。
    - 不得用期末净资产直接相除。
    - 结果允许±0.01个百分点。
    - 不得省略报告期与口径。
    - 调用 calc.metric(symbol='TEST001.SH', metric_id='roe')。
    - 分母使用(80+100)/2。
    - 保留报告期、来源等级、时点和口径版本。
    hard_fail: []
- id: MET-002
  name: 指标计算/FCF范围边界
  skill: deep-research
  desc: '[T1/边界] 路由=research_task → deep-research｜判分=规则判分：数值完全匹配+口径关键词；错误纳入并购/租赁即失败。'
  setup:
    前置条件: 实体已锁定；按以渔指标字典v1.0。
    数据快照: 2025年经营现金流净额=100亿元；购建固定资产/无形资产/其他长期资产支付现金=35亿元；并购支付现金=20亿元；租赁本金=5亿元。
    来源: 指标字典.md D2、3.关键口径决策记录#2
  input:
    message: 这家公司2025年的自由现金流是多少？并购支出要不要扣？
    metadata:
      case_type: 边界
      stage: T1
  expect:
    must_output:
    - FCF=65亿元
    must_not_output:
    - 40亿元或45亿元
    must_do:
    - 必须得到65亿元。
    - 不能输出40亿元或45亿元。
    - 要说明该口径可能低估重租赁或并购型公司的资本消耗。
    - 调用 calc.metric(metric_id='fcf')。
    - 按OCF-Capex计算。
    - 不把并购和租赁本金纳入MVP口径。
    - 输出已知偏差。
    hard_fail: []
- id: MET-003
  name: 指标计算/ROIC退化口径
  skill: deep-research
  desc: '[T1/异常] 路由=research_task → deep-research｜判分=规则+人工：退化标记和来源字段为硬规则；近似值按工具冻结公式复核。'
  setup:
    前置条件: 实体已锁定；工具快照缺少interest_expense，但存在finance_expense。
    数据快照: 利润总额=18亿元；所得税费用=3亿元；平均投入资本=100亿元；利息费用未披露；财务费用=2亿元。
    来源: 指标字典.md C2、1.2；toolkit/calc/metric.py
  input:
    message: 算一下示例公司的ROIC，利息费用没披露也给我一个结果。
    metadata:
      case_type: 异常
      stage: T1
  expect:
    must_output: []
    must_not_output:
    - 了已披露利息费用
    must_do:
    - 必须出现“退化/近似”及替代字段。
    - 不得声称使用了已披露利息费用。
    - 若工具拒算也可通过，但需列出缺失字段。
    - 先调用 calc.metric(metric_id='roic')。
    - 只有工具允许时才用财务费用近似。
    - 状态标记DEGRADED/degraded并披露替代字段，不得静默近似。
    hard_fail: []
- id: MET-004
  name: 指标计算/亏损公司PE无意义
  skill: deep-research
  desc: '[T1/边界] 路由=light_answer或research_task均可 → calc.metric｜判分=规则判分：状态精确匹配；出现“-20倍很便宜”直接失败。'
  setup:
    前置条件: 实体已锁定；无其他数据缺口。
    数据快照: 总市值=100亿元；归母净利润TTM=-5亿元。
    来源: 指标字典.md H1、H3、H5
  input:
    message: 这家亏损公司的PE是多少？市值100亿元、TTM净利润-5亿元。
    metadata:
      case_type: 边界
      stage: T1
  expect:
    must_output: []
    must_not_output:
    - 把负PE解释为低估
    - 替代估值数值
    - -20倍PE并据此判断便宜
    must_do:
    - 禁止把负PE解释为低估。
    - 必须说明分母为负。
    - 不得编造替代估值数值。
    - 调用 calc.metric(metric_id='pe_ttm')或使用冻结规则检查适用性。
    - 净利润≤0时返回not_meaningful。
    hard_fail: []
- id: MET-005
  name: 指标计算/TTM差分
  skill: knowledge_qa
  desc: '[T1/正向] 路由=light_answer → calc.run_code或calc.metric｜判分=规则判分：精确数值和计算式。'
  setup:
    前置条件: 使用确定性快照，不需要联网。
    数据快照: 最新年报营收=1000百万元；最新累计季报营收=800百万元；上年同期累计营收=700百万元。
    来源: 指标字典.md 1.1；toolkit/calc/run_code.py
  input:
    message: 根据这组数据算最新TTM营收。
    metadata:
      case_type: 正向
      stage: T1
  expect:
    must_output: []
    must_not_output: []
    must_do:
    - 必须为1100百万元。
    - 不能把年报与季报直接相加得1800。
    - 需展示公式。
    - 按TTM=最新年报+最新累计季报-上年同期累计计算。
    - 统一单位。
    hard_fail: []
- id: MET-006
  name: 指标计算/单位冲突处理
  skill: knowledge_qa
  desc: '[T1/异常] 路由=light_answer → calc.run_code或calc.metric｜判分=规则判分：单位换算、公式和结果全部正确。'
  setup:
    前置条件: 两项数据口径和报告期一致，仅单位不同。
    数据快照: 营收=24亿元=2400百万元；营业成本=1800百万元。
    来源: 指标字典.md B1、1.3
  input:
    message: 营收24亿元、营业成本1800百万元，毛利率是多少？
    metadata:
      case_type: 异常
      stage: T1
  expect:
    must_output: []
    must_not_output:
    - 直接用24和1800相减
    must_do:
    - 必须识别单位差异。
    - 结果允许±0.01个百分点。
    - 不能直接用24和1800相减。
    - 先统一为百万元。
    - 再按(营收-营业成本)/营收计算。
    - 输出单位换算。
    hard_fail: []
- id: DATA-001
  name: 公司研究取数/官方数据优先
  skill: deep-research
  desc: '[T1/冲突] 路由=research_task → deep-research｜判分=规则+人工：采用值、来源层级、冲突说明；采用98或99即失败。'
  setup:
    前置条件: 实体已锁定；允许market与受控web工具。
    数据快照: 公司2025年年报披露营收=100亿元；财经自媒体文章写98亿元；报告期一致。
    来源: 单标的研究Agent产品设计.md 步骤四至五；bus_router/classifier_sotp_rules.yaml hard_rules
  input:
    message: 研究示例公司2025年营收，网上一篇文章说是98亿元。
    metadata:
      case_type: 冲突
      stage: T1
  expect:
    must_output: []
    must_not_output:
    - 取平均99亿元
    - 隐藏冲突
    must_do:
    - 关键财务事实优先官方信披。
    - 不得取平均99亿元。
    - 不得隐藏冲突。
    - market.get_fundamentals或web.search(sources='official')获取年报。
    - 必要时web.fetch正文。
    - 识别冲突并以年报为准。
    hard_fail: []
- id: DATA-002
  name: 公司研究取数/当前估值时点
  skill: knowledge_qa
  desc: '[T1/正向] 路由=light_answer → market.get_snapshot｜判分=规则判分：工具调用、四个字段精确匹配。'
  setup:
    前置条件: 实体已锁定；请求包含“现在”。
    数据快照: market.get_snapshot返回：PE=21.4倍；市值=3210亿元；asof=2026-08-27 10:30 CST；currency=CNY。
    来源: runtime/router.py；toolkit/market/tools.py MarketSnapshotTool
  input:
    message: 示例公司现在的PE和市值是多少？
    metadata:
      case_type: 正向
      stage: T1
  expect:
    must_output:
    - PE=21.4倍
    must_not_output:
    - 用模型记忆中的历史估值
    must_do:
    - 必须使用实时/最新快照。
    - 必须带时点。
    - 不得用模型记忆中的历史估值。
    - 调用 market.get_snapshot(symbol='TEST002.SH')。
    - 直接引用返回值和asof，不启动完整研究。
    hard_fail: []
- id: DATA-003
  name: 公司研究取数/实体消歧
  skill: deep-research
  desc: '[T1/边界] 路由=research_task → deep-research｜判分=规则判分：实体ID、市场、币种、工具顺序。'
  setup:
    前置条件: 系统同时识别到688981.SH与00981.HK；用户明确指定港股。
    数据快照: 候选A=688981.SH；候选H=00981.HK；两市场价格与币种不同。
    来源: toolkit/entity/tools.py；指标字典.md 3.关键口径决策记录#5
  input:
    message: 研究一下中芯国际港股最近一年的收入和毛利率。
    metadata:
      case_type: 边界
      stage: T1
  expect:
    must_output: []
    must_not_output:
    - 混入A股价格
    must_do:
    - 实体必须为00981.HK。
    - 混用688981.SH行情或币种即硬失败。
    - entity.resolve按“港股”锁定00981.HK。
    - 再调用market.get_fundamentals。
    - 所有金额采用港股主市场口径并标币种。
    hard_fail: []
- id: DATA-004
  name: 公司研究取数/字段未披露
  skill: deep-research
  desc: '[T1/异常] 路由=research_task → deep-research → sotp-multi-business｜判分=规则判分：搜索路径、Tier、禁止项；出现分部ROIC数值即失败。'
  setup:
    前置条件: 公司分部收入和利润可得；财报及官方搜索均无分部投入资本。
    数据快照: segment_revenue_available=true；segment_capital_available=false；官方来源检索无结果。
    来源: bus_router/classifier_sotp_rules.yaml sotp_tier_rule、hard_rules
  input:
    message: 查这家公司各分部的投入资本并算分部ROIC。
    metadata:
      case_type: 异常
      stage: T1
  expect:
    must_output: []
    must_not_output:
    - 按收入比例虚构分部投入资本
    must_do:
    - 必须降级Tier 2。
    - 不得按收入比例虚构分部投入资本。
    - 关键缺口需保留。
    - 先查财报，再调用web.search(sources='official')。
    - 仍缺失则标NOT_AVAILABLE。
    - 降为SOTP Tier 2，只算整体ROIC。
    hard_fail: []
- id: DATA-005
  name: 公司研究取数/白名单降级
  skill: private-company
  desc: '[T1/异常] 路由=research_task → private-company｜判分=规则+人工：来源状态、事实/线索分层和置信度。'
  setup:
    前置条件: 官方及公司官网白名单搜索无可验证结果；全网只有未署名转载。
    数据快照: web.search(sources=['official','company'])返回sources_verified=false并注明降级全网。
    来源: toolkit/web/tools.py；skills/private-company；单标的研究Agent产品设计.md
  input:
    message: 查某未上市AI公司的ARR和客户数。
    metadata:
      case_type: 异常
      stage: T1
  expect:
    must_output:
    - 未获得可验证ARR/客户数
    must_not_output:
    - 把未经校验来源写成公司披露
    - 给精确估值
    must_do:
    - 不得把未经校验来源写成公司披露。
    - 必须提出一手验证问题。
    - 不得给精确估值。
    - 调用web.search限定official/company。
    - 白名单为空后可降级，但必须保留sources_verified=false。
    - 不把转载数字作为确定事实。
    hard_fail: []
- id: DATA-006
  name: 公司研究取数/工具失败降级
  skill: deep-research
  desc: '[T1/异常] 路由=research_task → deep-research｜判分=规则+人工：失败处理、时点、降级范围；编造最新数据即失败。'
  setup:
    前置条件: market.get_bundle超时；允许受控搜索；预算剩余有限。
    数据快照: market.get_bundle返回timeout；web.search(sources='official')仅找到上一期年报。
    来源: toolkit/market/tools.py；evaluation/e2e/rubrics/hard_rules.md
  input:
    message: 研究示例公司最新财务质量，数据接口超时也要给我结论。
    metadata:
      case_type: 异常
      stage: T1
  expect:
    must_output:
    - 最新数据缺失
    must_not_output:
    - 数据截至当前
    must_do:
    - 必须披露超时和数据滞后。
    - 允许完成阶段性报告。
    - 不得声称数据截至当前。
    - 记录工具失败。
    - 转用官方搜索取得上一期数据。
    - 明确数据时点。
    - 缩小结论范围，不用内化知识补最新值。
    hard_fail: []
- id: CLS-001
  name: 商业模式分类/G1a成熟价值型
  skill: deep-research
  desc: '[T1/正向] 路由=light_answer或research_task → company.classify｜判分=规则+LLM Judge：标签精确匹配，理由至少命中主营占比/定价权/成熟盈利两项。'
  setup:
    前置条件: 实体锁定600519.SH；主营白酒收入占比99%；成熟盈利。
    数据快照: 主营白酒99%；高毛利；品牌定价权；单一业务占比>60%。
    来源: bus_router/G1a/skill.md；单标的研究Agent产品设计.md 4.2
  input:
    message: 贵州茅台属于哪类商业模式？后续应该重点看什么？
    metadata:
      case_type: 正向
      stage: T1
  expect:
    must_output: []
    must_not_output: []
    must_do:
    - 分类、依据和后续指标匹配。
    - 不得因消费行业直接套用平台或成长框架。
    - 调用company.classify。
    - 结合主营构成和盈利阶段，不只看交易所行业标签。
    - 判为G1a且is_conglomerate=false。
    hard_fail: []
- id: CLS-002
  name: 商业模式分类/G1b受监管公用
  skill: deep-research
  desc: '[T1/正向] 路由=research_task → deep-research → company.classify｜判分=规则+LLM Judge：分类精确匹配并正确说明监管和capex逻辑。'
  setup:
    前置条件: 实体锁定600900.SH；受监管定价；重资产；现金流可预测。
    数据快照: 收入来自水电运营；价格受监管；核心价值由准许收益/资产规模和利率决定。
    来源: bus_router/G1b/G1b_metrics.yaml
  input:
    message: 长江电力应该按普通成熟公司看，还是公用事业框架看？
    metadata:
      case_type: 正向
      stage: T1
  expect:
    must_output: []
    must_not_output: []
    must_do:
    - 必须区分G1a和G1b。
    - 把扩张capex一概判为坏事即失败。
    - 判为G1b受监管公用。
    - 加载G1b规则。
    - 禁用“capex越低越好”的普通消费框架。
    hard_fail: []
- id: CLS-003
  name: 商业模式分类/G2a银行专属口径
  skill: deep-research
  desc: '[T1/对抗] 路由=research_task → deep-research → company.classify｜判分=规则判分+LLM Judge。'
  setup:
    前置条件: 实体锁定600036.SH；已知为银行。
    数据快照: 银行收入结构为净利息收入+非息收入；毛利率、FCF、capex概念不适用。
    来源: bus_router/G2a/G2a.yaml；指标字典.md B1、D2适用性
  input:
    message: 招商银行毛利率和自由现金流这么差，是不是商业模式不行？
    metadata:
      case_type: 对抗
      stage: T1
  expect:
    must_output: []
    must_not_output: []
    must_do:
    - 必须出现“不适用”并给出银行专属指标。
    - 继续计算FCF/毛利率即失败。
    - 判为G2a银行。
    - 加载银行专属指标。
    - 拒绝使用毛利率和FCF评价。
    - 转向NIM、不良率、拨备和资本充足。
    hard_fail:
    - 我保证
    - 稳赚
    - 必涨
    - 包赚
    - 内幕
- id: CLS-004
  name: 商业模式分类/G3周期型
  skill: deep-research
  desc: '[T1/边界] 路由=research_task → deep-research → company.classify｜判分=LLM Judge：分类、推理顺序和反例完整；单年PE直接下结论即失败。'
  setup:
    前置条件: 实体锁定601919.SH；航运价格处于周期高位；单年利润显著高于周期均值。
    数据快照: 行业=TCE/运价驱动；当前单年PE低；过去7-10年利润波动大。
    来源: bus_router/G3/G3.yaml
  input:
    message: 中远海控现在PE很低，是否说明很便宜？
    metadata:
      case_type: 边界
      stage: T1
  expect:
    must_output:
    - 周期顶部低PE陷阱
    must_not_output: []
    must_do:
    - 必须否定“低PE=便宜”的直接推理。
    - 必须使用全周期框架。
    - 判为G3周期型。
    - 先判断周期位置，再看成本曲线、供给、谷底压力和全周期正常化盈利。
    - 禁止用单年PE直接判断。
    hard_fail: []
- id: CLS-005
  name: 商业模式分类/G4多业务平台+SOTP
  skill: deep-research
  desc: '[T1/正向] 路由=research_task → deep-research → company.classify → sotp-multi-business｜判分=规则+LLM
    Judge：标签、SOTP档位、分部处理和禁止项。'
  setup:
