# 用户侧质量评测用例（质量 5 项 + 新手友好 5 项，100 分制）
#
# 每个用例带一段 `sample_conclusion`（待打分的结论文本）和期望分数区间：
#   expect.quality.min_score —— 得分必须 ≥ 该值（好样本回归用）
#   expect.quality.max_score —— 得分必须 ≤ 该值（坏样本回归用）
#
# 用途：回归测试打分引擎本身——好样本该得高分，坏样本该得低分，
# 引擎分数不落在预期区间时说明打分逻辑被改坏了。
cases:
  # ── 好样本：新手友好的 ROIC 讲解，应得 80+ ──────────────────────
  - id: quality01
    name: 新手友好的 ROIC 讲解
    skill: deep-research
    desc: 好样本：结构清晰、结论先行、术语全部解释、有风险提示和行动指引
    input:
      message: "讲一下 ROIC 是什么，对新手友好一点"
    sample_conclusion: |
      # 关于 ROIC 的通俗解读

      综合判断：ROIC 是衡量一家公司"赚钱效率"的核心指标，值得重点关注。

      ## 一、ROIC 是什么

      ROIC（投入资本回报率），简单说就是公司每投入一块钱，一年能赚回多少钱。
      比如投入 100 块能赚回 30 块，ROIC 就是 30%。打个比方，它就像你存银行的
      利率——利率越高，钱生钱的能力越强。

      ## 二、怎么看这个指标

      1. ROIC 高于 15% 算优秀，说明公司赚钱效率高；
      2. 长期稳定高于资金成本，说明护城河（即竞争对手难以模仿的优势）真实存在；
      3. 低于 5% 就要警惕，说明投入产出比很低。

      ## 三、风险提示

      以上解读仅供参考，不构成投资建议。市场有风险，投资需谨慎，请结合自身情况判断。

      ## 四、下一步建议

      建议您结合自由现金流（即经营活动产生的现金净流入）和资产负债率一起看，
      可以关注公司连续三年的 ROIC 变化趋势。
    expect:
      quality:
        min_score: 80

  # ── 好样本：完整公司研究结论，应得 80+ ──────────────────────────
  - id: quality02
    name: 结构完整的公司研究结论
    skill: deep-research
    desc: 好样本：分节论述、结论先行、数字带来源、有风险提示和后续动作
    input:
      message: "研究一下这家公司值不值得关注"
    sample_conclusion: |
      # 贵州茅台投资价值分析

      总体来看，茅台是一家现金流质量极高、护城河（即品牌壁垒）深厚的好公司，
      但当前估值偏高，建议结合自身风险承受能力决策。

      ## 一、生意质量

      茅台的毛利率（即每百元收入中扣除直接成本后留下的部分）长期维持在 90% 以上，
      净利率（即扣除所有成本费用后最终留下的利润占比）超过 50%，
      ROE（净资产收益率）稳定在 30% 左右，盈利质量在 A 股属顶尖水平。

      ## 二、关键风险

      1. 白酒行业整体增速放缓，年轻人饮酒习惯变化是长期变量；
      2. 渠道库存与批价波动可能影响短期业绩；
      3. 政策面（如限酒令）存在不确定性。

      ## 三、估值判断

      当前市盈率处于近五年中位数附近，谈不上便宜，除非业绩超预期，
      否则上行空间有限。

      ## 风险提示

      以上内容仅供参考，不构成投资建议。市场有风险，投资需谨慎。

      ## 下一步建议

      建议您先看公司最新财报的合同负债（即预收的货款）和经营现金流（即实际
      收到的现金），可以关注批价走势再决定是否跟踪。
    expect:
      quality:
        min_score: 80

  # ── 坏样本：满屏术语无解释、无风险提示，应得 50 以下 ────────────
  - id: quality03
    name: 术语轰炸型结论
    skill: deep-research
    desc: 坏样本：术语密度极高、零解释、零风险提示、无结构
    input:
      message: "快报一下关键财务数据"
    sample_conclusion: |
      ROIC 达到 30%，EBITDA 增长 15%，OCF 与净利润比值 0.75，ROE 20%，
      PE 15 倍，PB 3 倍，DCF 估值显示内在价值 2000 亿，CAGR 12%，
      股息率 2%，合同负债同比 -16.5%，应收账款周转天数 45 天，
      商誉占总资产 8%，股权质押比例 20%，有息负债 500 亿，
      自由现金流 100 亿，资产负债率 55%。
    expect:
      quality:
        max_score: 50

  # ── 坏样本：一大段流水账、无结构无结论，应得 55 以下 ────────────
  - id: quality04
    name: 流水账式结论
    skill: deep-research
    desc: 坏样本：无小标题无分点、结论最后才出现、无风险提示
    input:
      message: "聊聊这家公司怎么样"
    sample_conclusion: |
      这家公司是一家做调味品的公司，主要产品包括酱油、醋、蚝油等，产品覆盖全国市场，
      拥有完善的销售渠道，品牌知名度较高，市场份额领先，管理层经验丰富，
      近几年收入保持增长，利润也有所提升，成本控制得当，渠道下沉策略见效，
      未来有望继续增长，但竞争也很激烈，行业增速放缓，原材料成本上升也会
      带来压力，总体来说公司质地不错，值得继续研究。
    expect:
      quality:
        max_score: 55

  # ── 中样本：有结构但术语没解释、缺风险提示，40-80 区间 ──────────
  - id: quality05
    name: 有结构但术语未解释
    skill: deep-research
    desc: 中样本：结构清楚、结论先行，但术语未配解释、无风险提示
    input:
      message: "这家公司的投资价值怎么样"
    sample_conclusion: |
      # 投资价值分析

      综合来看，该公司的 ROIC 为 30%，ROE 为 20%，PE 为 15 倍，
      均处于行业前列，成长性良好。

      1. 盈利能力强：ROIC 和 ROE 双高，说明赚钱效率高；
      2. 估值合理：PE 处于历史中位数附近；
      3. 现金流健康：OCF 与净利润比值 0.8，质量高。

      建议关注后续季报的业绩兑现情况。
    expect:
      quality:
        min_score: 40
        max_score: 80

  # ── 中样本：有风险提示但废话多、篇幅短，40-80 区间 ──────────────
  - id: quality06
    name: 有风险提示但空话多
    skill: deep-research
    desc: 中样本：有风险提示和行动指引，但空话套话多、篇幅偏短
    input:
      message: "总结一下这家公司"
    sample_conclusion: |
      # 总结

      综上所述，这家公司总体而言值得关注。众所周知，白酒行业竞争激烈，
      值得注意的是，公司近年来的增长主要依赖提价而非销量，在某种程度上
      存在隐忧。总而言之，公司基本面尚可，但估值不便宜，需要谨慎对待。

      风险提示：以上内容仅供参考，不构成投资建议。

      建议您结合自身情况判断。
    expect:
      quality:
        min_score: 40
        max_score: 80
