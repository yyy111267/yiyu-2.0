stage: 04_granularity
name: 循环前处理·环节②研究粒度决策（granularity）
target: PRD 5.3 环节② → runtime/preloop/granularity.py
status: ready
# 该目录原为旧 PRD 商业模式分类占位（pending），已升级为循环前处理环节② granularity 正式评测。
# 用例来源：《评测用例集-循环前处理》D 类（确定性，离线 mock LLM）。
# input.facts:       构造 CompanyFacts 的最小字段（one_line_business / valuation_industry /
#                    segments / info_richness）
# input.llm_responses: LLM 返回 raw dict 列表（mode/units/confidence/source/open_questions）
# input.force_refresh / cache_probe: 缓存行为探针
cases:
  - id: gr_d01
    name: D-01 单一业务 → whole（units 恰好 1，needs_sotp 否）
    input:
      facts:
        one_line_business: 高端白酒生产与销售
        valuation_industry: 白酒
        segments:
          - name: 白酒
            ratio: 100.0
        info_richness: A
      llm_responses:
        - mode: whole
          units:
            - id: u_whole
              scope: 整体公司
              reason: 单一主营业务，边界清晰
              differential_dimensions: []
          confidence: 0.9
          source: 年报分部信息
          open_questions: []
    expect:
      assertions:
        - path: mode
          op: eq
          value: whole
        - path: units
          op: len_ge
          value: 1
        - path: confidence
          op: ge
          value: 0.6

  - id: gr_d02
    name: D-02 多业务 → split（2 单元，needs_sotp 真，每单元命中差异条件）
    input:
      facts:
        one_line_business: 游戏+广告+云的综合互联网公司
        valuation_industry: 互联网
        segments:
          - name: 游戏
            ratio: 40.0
          - name: 广告
            ratio: 35.0
        info_richness: A
      llm_responses:
        - mode: split
          units:
            - id: u_game
              scope: 游戏业务
              reason: 游戏盈利模式与广告不同
              differential_dimensions: [profit_model, valuation_logic]
            - id: u_ad
              scope: 广告业务
              reason: 估值逻辑相互独立
              differential_dimensions: [valuation_logic]
          confidence: 0.85
          source: 年报分部
          open_questions: []
    expect:
      assertions:
        - path: mode
          op: eq
          value: split
        - path: units
          op: len_ge
          value: 2
        - path: is_fallback
          op: eq
          value: false

  - id: gr_d03
    name: D-03 置信度护栏（<0.6 → 回退 whole，is_fallback 真）
    input:
      facts:
        one_line_business: 业务结构复杂但信源不足
        valuation_industry: 综合
        segments:
          - name: 业务A
            ratio: 50.0
        info_richness: B
      llm_responses:
        - mode: split
          units:
            - id: u_a
              scope: 业务A
              reason: 证据不足，判弱
              differential_dimensions: [profit_model]
          confidence: 0.4
          source: 弱信源
          open_questions: ["证据不足"]
    expect:
      assertions:
        - path: is_fallback
          op: eq
          value: true
        - path: mode
          op: eq
          value: whole

  - id: gr_d04
    name: D-04 缓存命中（同 facts_version 第二次决策不重复调 LLM）
    input:
      facts:
        one_line_business: 单一业务公司
        valuation_industry: 制造
        segments:
          - name: 主营
            ratio: 100.0
        info_richness: A
      llm_responses:
        - mode: whole
          units:
            - id: u_whole
              scope: 整体
              reason: 单一业务
              differential_dimensions: []
          confidence: 0.9
          source: 年报
          open_questions: []
      cache_probe: true
    expect:
      assertions:
        - path: mode
          op: eq
          value: whole
        - path: _cache_hit_second_call
          op: eq
          value: true

  - id: gr_d05
    name: D-05 force_refresh 绕过缓存（同 facts 仍重新调用 LLM）
    input:
      facts:
        one_line_business: 单一业务公司
        valuation_industry: 制造
        segments:
          - name: 主营
            ratio: 100.0
        info_richness: A
      llm_responses:
        - mode: whole
          units:
            - id: u_whole
              scope: 整体
              reason: 单一业务
              differential_dimensions: []
          confidence: 0.9
          source: 年报
          open_questions: []
      force_refresh: true
      refresh_probe: true
    expect:
      assertions:
        - path: mode
          op: eq
          value: whole
        - path: _refreshed_recalled_llm
          op: eq
          value: true

  - id: gr_d06
    name: D-06 腾讯式三业务 → split（3 单元，needs_sotp 真）
    input:
      facts:
        one_line_business: 游戏+广告+金融科技与企业服务的综合公司
        valuation_industry: 互联网
        segments:
          - name: 游戏
            ratio: 30.0
          - name: 广告
            ratio: 20.0
          - name: 金融科技与企业服务
            ratio: 30.0
        info_richness: A
      llm_responses:
        - mode: split
          units:
            - id: u_game
              scope: 游戏
              reason: 盈利模式相互独立
              differential_dimensions: [profit_model]
            - id: u_ad
              scope: 广告
              reason: 估值逻辑相互独立
              differential_dimensions: [valuation_logic]
            - id: u_fin
              scope: 金融科技与企业服务
              reason: 资本投入结构不同
              differential_dimensions: [capital_input]
          confidence: 0.88
          source: 年报分部
          open_questions: []
    expect:
      assertions:
        - path: mode
          op: eq
          value: split
        - path: units
          op: len_ge
          value: 3
