stage: 08_sufficiency
name: 准出硬规则（引用与计算核对）
target: PRD 5.5 / 硬规则安全门 → toolkit/delivery/submit_conclusion.py::validate_conclusion
status: ready
# 说明：纯函数离线可跑。R1–R5 逐条覆盖 + 否定语境边界用例。
# 这是结论返回用户前的最后一道代码级防线，任何改动必须保持本组全绿。
cases:
  - id: sf_001
    name: 合规结论 → 放行
    input:
      conclusion: "综合判断：观察。建议持续跟踪基本面变化。"
    expect:
      assertions:
        - path: passed
          op: eq
          value: true
        - path: violated_rules
          op: len_le
          value: 0
    note: 无内部研究语言、无价格、非买入 → R1–R5 全不触发
  - id: sf_002
    name: R4——目标价拦截
    input:
      conclusion: "该股目标价 120 元，建议关注。"
    expect:
      assertions:
        - path: passed
          op: eq
          value: false
        - path: violated_rules
          op: contains
          value: R4_no_price_target
    note: 具体买卖价/目标价是红线，正则拦截
  - id: sf_003
    name: R1——G5 未盈利标的禁买入结论
    input:
      conclusion: "游戏业务拐点确认，建议买入。"
      tier: "G5"
    expect:
      assertions:
        - path: passed
          op: eq
          value: false
        - path: violated_rules
          op: contains
          value: R1_no_buy_for_g5_c
    note: 未盈利标的（G5）+ 买入结论 → 拦截；防「未盈利误杀」与「未盈利重仓」
      两个方向的口径混乱
  - id: sf_004
    name: R3——内部研究语言拦截
    input:
      conclusion: "ROIC 为 30%（base_pack，冻结口径），看好该公司长期发展空间。"
    expect:
      assertions:
        - path: passed
          op: eq
          value: false
        - path: violated_rules
          op: contains
          value: R3_no_internal_jargon
    note: 内部工具名与审计语言不得进入用户正文
  - id: sf_005
    name: 否定语境不算买入信号（边界）
    input:
      conclusion: "当前估值偏贵，不建议买入。"
    expect:
      assertions:
        - path: passed
          op: eq
          value: true
    note: 「不建议买入」是风险提示不是买入信号，须先剔除否定语境再判 is_buy；
      误拦会把正常的风险提示打成违规
  - id: sf_006
    name: R5——数据降级须一手验证指引
    input:
      conclusion: "财务数据部分缺失，初步判断经营平稳。"
      data_status: "degraded"
    expect:
      assertions:
        - path: passed
          op: eq
          value: false
        - path: violated_rules
          op: contains
          value: R5_need_primary_verification
    note: 数据降级时结论必须给一手验证指引，否则拦截
  - id: sf_007
    name: R6——关键数字未出现在工具观测中须拦截
    input:
      conclusion: "营收 123.4 亿元，ROE 18.5%。"
      require_numeric_sources: true
      tool_observations:
        - source: market.get_bundle
          content:
            revenue: 99.9
            roe: 12.1
    expect:
      assertions:
        - path: passed
          op: eq
          value: false
        - path: violated_rules
          op: contains
          value: R6_numeric_source_required
    note: 结论数字必须能回到工具观测；只写“来源”字样不够
  - id: sf_008
    name: R6——关键数字与工具观测匹配可放行
    input:
      conclusion: "营收 123.4 亿元，ROE 18.5%。"
      require_numeric_sources: true
      tool_observations:
        - source: market.get_bundle
          content:
            revenue: "123.4 亿元"
            roe: "18.5%"
    expect:
      assertions:
        - path: passed
          op: eq
          value: true
    note: 保守版本先做数值近似匹配，后续再扩字段级 source_trace
