[project]
name = "yiyu-agent"
version = "2.0.0"
description = "以渔2.0 - 多智能体投资研究系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "PyYAML>=6.0.0",
    "SQLAlchemy>=2.0.0",
    "httpx>=0.26.0",
    "openai>=1.10.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=1.8.0",
    # 行情数据源：akshare = A股财报主源(新浪三表) + A股新闻
    # 注：不依赖 yfinance——港美股兜底 YFinanceProvider 走 Yahoo Finance，
    # 当前网络不可达（SSL 被 RST，实测 exit=35），装了也取不到数。
    "akshare>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "core", "evaluation", "ingest", "runtime", "scripts", "store", "toolkit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict_optional = true
